if(p.template==='preview'||p.template==='share'||p.template==='playground')return `${p.template==='playground'?field('配置 / 代码输入','保留现有编辑器与执行方式'):''}<div class="document"><strong>内容预览</strong><p>真实预览由当前页面组件提供。</p><p>此区域表示内容尺度和留白，不替代业务产物。</p></div>${p.sections.slice(1).map((s,i)=>simpleSection(p,s,i)).join('')}`;
if(p.template==='records')return records(p);
if(p.template==='flow')return p.sections.map((s,i)=>i===0?`<p>${esc(s)}</p>`:field(s,p.path==='/tenant/selection'?(i===1?'产品示例公司':i===2?'产品团队':'按现有门禁显示'):'沿用现有流程内容')).join('')+primary(p.actions[0]);
return p.sections.filter(s=>!/^(返回|标题|页面说明|品牌|全局导航|Craft 会话导航)/.test(s)).map((s,i)=>simpleSection(p,s,i)).join('');}
function render(){const p=current,mobile=$('viewport').value==='mobile',state=$('state').value;document.documentElement.classList.toggle('light',$('theme').value==='light');$('page-title').textContent=`${p.id} · ${p.title}`;$('page-path').textContent=p.path;$('template').textContent=`${p.template} · ${p.change}`;$('sections').innerHTML=p.sections.map(s=>`<li>${esc(s)}</li>`).join('');$('actions').innerHTML=p.actions.map(a=>`<li>${esc(a)}</li>`).join('');$('states').textContent=`目标状态：${p.states.join('、')}`;$('mobile').textContent=p.mobile;$('source').textContent=p.source;$('changes').textContent='V：视觉统一；L：布局/局部交互提案。I 导航增强在总方案中独立评审。';$('note').textContent=p.note||'保留现有路由、权限、字段和数据契约。操作能力以当前实现为上限。';$('footer').textContent=`设计范围：${DATA.pages.length} 个页面 / ${DATA.routes.length} 个路由声明（另有 4 个布局、7 个跳转）。当前筛选只影响索引。示意稿不代表产品功能已实现。`;
const flow=['flow','share'].includes(p.template),craft=p.template.startsWith('craft');let body=specialized(p);if(state!=='normal'){const messages={loading:['正在加载','保留布局节奏。示意稿不模拟真实等待或网络请求。'],empty:['当前没有内容','此状态仅在业务语义允许时使用；未配置、无权限和故障必须分别说明。'],error:['当前内容未能获取','说明受影响的范围；保留已有内容，并使用当前页面提供的恢复入口。'],permission:['当前没有访问权限','保留作用范围说明；不展示未授权数据或可执行的管理操作。']};body=`<div class="notice"><strong>${messages[state][0]}</strong><p>${messages[state][1]}</p><p>该页特定状态：${esc(p.states.join('、'))}</p></div>`}
$('screen').className=`screen${mobile?' narrow':''}${p.template==='craft'?' craftscreen':''}`;$('screen').innerHTML=`${(flow?'':nav(p,p.template==='craft'))+(craft?'<aside class="sessionnav"><strong>Craft</strong><div class="mock-secondary">新建会话</div><div class="nav-label active">产品原型</div><div class="nav-label">周报整理</div><div class="nav-label">计划任务</div></aside>':'')}<div class="${flow?'flowmain':'mockmain'}">${flow?`<div class="wordmark">${icon}OpenBot</div>`:''}${header(p)}${body}<div class="sample-note">设计示意 · 示例数据 · ${esc(p.id)}</div></div>${p.template==='craft'?'<aside class="output"><div class="tabs"><span class="tab-active">预览</span><span>文件</span><span>产物</span></div><div class="document"><strong>产品周报</strong><p>本周进展</p><p>整理项目中的重要变化，保留来源与待确认事项。</p><h3>下一步</h3><p>根据确认结果继续处理。</p></div></aside>':''}`;
if(!mobile&&p.path==='/channel/$channelId'&&state==='normal')$('screen').insertAdjacentHTML('beforeend',`<aside class="context"><h3>工作坊</h3><div class="tabs"><span class="tab-active">过程</span><span>文件</span><span>产物</span></div><p>六个现有 Tab，空间不足时滚动或切换。</p>${row('当前过程','等待你确认',pill('待确认','warn'))}</aside>`);
const links=document.querySelectorAll('.page-link');links.forEach(b=>{if(b.dataset.id===p.id)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});}
function index(){const q=$('search').value.trim().toLowerCase(),scope=$('scope').value;let last='',html='';const list=DATA.pages.filter(p=>(!scope||p.scope===scope)&&(!q||(p.id+p.title+p.path).toLowerCase().includes(q)));for(const p of list){if(p.scope!==last){html+=`<div class="group-label">${esc(p.scope)}</div>`;last=p.scope}html+=`<button class="page-link" data-id="${p.id}" ${p.id===current.id?'aria-current="page"':''}><small>${p.id}</small>${esc(p.title)}</button>`}$('index').innerHTML=html||'<p style="padding:12px">没有匹配的页面。</p>';document.querySelectorAll('.page-link').forEach(b=>b.addEventListener('click',()=>{current=DATA.pages.find(p=>p.id===b.dataset.id);render()}));}
$('search').addEventListener('input',index);$('scope').addEventListener('change',index);['theme','viewport','state'].forEach(id=>$(id).addEventListener('change',render));index();render();
</script></body></html>
