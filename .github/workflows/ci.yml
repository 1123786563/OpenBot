        env:
          PICKED_HARNESS_IMAGE: openbot-agent-langgraph-agui:test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # #416 nightly gate: a scheduled event fires every job in this file, so every
    # other job stays off the nightly run — the schedule exists for the one
    # craft-preview-e2e job below, not a second copy of the whole CI bill.
    # Skipped counts as passing for `verify`, which itself carries the same gate,
    # so the nightly run reports exactly the e2e job.
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.only-craft-preview-e2e)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build

  # Migration files and the schema they were generated from, checked against each other. A snapshot
  # that has drifted from the schema produces a migration nobody wrote, applied to somebody's
  # database on their next deploy. Neither command needs a running database, only the config.
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # #416 nightly gate: a scheduled event fires every job in this file, so every
    # other job stays off the nightly run — the schedule exists for the one
    # craft-preview-e2e job below, not a second copy of the whole CI bill.
    # Skipped counts as passing for `verify`, which itself carries the same gate,
    # so the nightly run reports exactly the e2e job.
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.only-craft-preview-e2e)
    services:
      # A real database built by the migration chain alone — the generate probe compared
      # schema ↔ snapshot and was blind to a snapshot drifted from the SQL (#436: 38 tables
      # / 292 columns shipped with no migration; fresh deployments crashed at boot).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: openbot
          POSTGRES_DB: openbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://openbot:openbot@localhost:5432/openbot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # Collisions and gaps between the migration files themselves.
      - run: bunx drizzle-kit check --config=drizzle.config.ts
        working-directory: server
      # The enterprise roles are a migration precondition, not a migration concern.
      - name: Enterprise role prerequisites
        working-directory: server
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U openbot -d postgres -f - < ops/enterprise/roles.sql
      - name: Fresh database migrates
        working-directory: server
        run: bun scripts/migrate.ts
      # Either direction of drift fails: a column the schema declares but no migration
      # creates (the #436 failure), or a table the migrations keep but no schema declares.
      - name: Schema has no unwritten migration
        working-directory: server
        run: bun scripts/db-drift-check.ts
      # And the result boots: a migrated database that cannot start the server is the other
      # half of #436 (the seed path crashed on skills.icon the moment it inserted).
      - name: Fresh database boots
        working-directory: server
        run: |
          set -euo pipefail
          printf 'KEY_ENCRYPTION_KEY=%s\nOPENBOT_SINGLE_USER=true\nINTELLIGENCE_API_KEY=ci-dummy\nINTELLIGENCE_API_URL=http://localhost:9\nINTELLIGENCE_GATEWAY_WS_URL=ws://localhost:9\n' "$(bun -e 'console.log(Buffer.from(crypto.getRandomValues(new Uint8Array(32))).toString("base64"))')" > .ci-boot.env
          timeout 45 bun --env-file=.ci-boot.env src/index.ts > boot.log 2>&1 &
          for i in $(seq 1 45); do
            grep -q "OpenBot server listening" boot.log && exit 0
            sleep 1
          done
          echo "::error::server did not reach 'listening' on a fresh database"
          tail -40 boot.log
          exit 1

  # The image is the artefact people deploy, and almost nothing about whether it works is visible to
  # the checks above. A dangling symlink, a supervised service that exits, a missing binary: all of
  # them typecheck, lint and test perfectly.
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The only slow job: it builds the container and boots it, ~14 minutes. The four checks above are
    # seconds and stay on every push, because they catch most things cheaply. This one is the cost, so
    # on a pull request it runs only when an admin adds the `full-ci` label — the point at which the PR
    # is actually a merge candidate. On main and through the release workflow_call it always runs, so
    # nothing reaches a release without it. `verify` treats a skipped job as passing, so an unlabelled
    # PR is green on the cheap checks alone.
    # #416 nightly gate prepended to the existing cost gate (same shape as every
    # other job: off the schedule and the e2e-only dispatch).
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.only-craft-preview-e2e) &&
      (
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'full-ci')
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Loaded rather than pushed: this runs on pull requests, including from forks, and it proves
      # the image builds without granting anything the ability to publish one.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: openbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Building it says the layers resolve. Running it says the supervision tree comes up and stays
      # up, which is a different claim and the one that has broken before.
      - name: The image boots and serves
        run: |
          set -euo pipefail
          # `OPENBOT_SINGLE_USER=true` because this boots a deployment with no identity provider, and
          # the image sets NODE_ENV=production, where that combination refuses to start rather than
          # serve an open deployment. Saying so is the point: the flag is how somebody declares they
          # meant it. This was `OPENBOT_DEV_NO_AUTH=1` before, which the code never accepted at all,
          # since it compares against the exact string "true"; it did nothing and nothing noticed.
          #
          # Placeholders, not secrets. `loadConfig` refuses to start without Intelligence and a
          # licence configured, but it only checks that they are present and well-formed; nothing is
          # contacted at start-up and /api/capabilities reads config alone. So this proves the image
          # boots and serves without needing a licence, which is the part CI cannot have: a licence
          # is bound to the machine it was issued for. Whether Intelligence actually answers is what
          # the smoke journey checks, on a real deployment.
          docker run -d --name openbot-ci -p 3001:3001 \
            -e EMBEDDED_POSTGRES=on \
            -e KEY_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e TRUSTED_ORIGINS=http://localhost:3001 \
             -e OPENBOT_SINGLE_USER=true \
             -e INTELLIGENCE_API_URL=https://api.intelligence.copilotkit.ai \
            -e INTELLIGENCE_GATEWAY_WS_URL=wss://realtime.intelligence.copilotkit.ai \
            -e INTELLIGENCE_API_KEY=ci-not-a-real-key \
            openbot:ci
          for attempt in $(seq 1 150); do
            if curl -fsS http://localhost:3001/api/capabilities >/dev/null 2>&1; then
              echo "answered after ${attempt}s"
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=openbot-ci)" ]; then
              echo "::error::The container exited before it answered."
              docker logs openbot-ci
              exit 1
            fi
            sleep 1
          done
          echo "::error::No answer on /api/capabilities within 150s."
          docker logs openbot-ci
          exit 1
      - name: Supervision tree is stable, not respawning
        run: |
          set -euo pipefail
          # A supervised service that exits is restarted forever. That looks healthy from outside for
          # as long as something else is answering, so the log is where it shows.
          sleep 15
          if docker logs openbot-ci 2>&1 | grep -Eic 'restarting|respawn' | grep -qv '^0$'; then
            echo "::error::A supervised service is restarting."
            docker logs openbot-ci 2>&1 | grep -Ei 'restarting|respawn' | head -20
            exit 1
          fi
          test -n "$(docker ps -q -f name=openbot-ci)" || {
            echo "::error::The container is no longer running after 15s."
            docker logs openbot-ci
            exit 1
          }
      - name: A Bot's shell cannot reach the deployment secrets
        run: |
          set -uo pipefail
          if docker exec -u pwuser openbot-ci env -i PATH=/usr/bin:/bin sh -c '
                for e in /proc/[0-9]*/environ; do tr "\0" "\n" < "$e" 2>/dev/null; done
              ' | grep -q "^KEY_ENCRYPTION_KEY="; then
            echo "::error::A pwuser shell reads KEY_ENCRYPTION_KEY from a sibling process /proc/<pid>/environ."
            exit 1
          fi
          if docker exec -u pwuser openbot-ci env -i PATH=/usr/bin:/bin sh -c \
                'cat /run/s6/container_environment/KEY_ENCRYPTION_KEY 2>/dev/null' | grep -q .; then
            echo "::error::A pwuser shell reads KEY_ENCRYPTION_KEY from /run/s6/container_environment."
            exit 1
          fi
          echo "pwuser cannot reach KEY_ENCRYPTION_KEY"
      - if: always()
        run: docker rm -f openbot-ci >/dev/null 2>&1 || true

  # The five images the release publishes alongside the one above. Nothing else here builds them:
  # they are built by `docker compose up --build`, which only the smoke journey runs and which
  # cannot run in CI. So a broken `supervisor/Dockerfile` used to surface during a release, after
  # the `openbot` image had already been pushed, which is the one failure this repository calls out
  # as leaving a published image with nothing pointing at it.
  #
  # Built, not pushed, and one architecture: this answers whether the Dockerfile resolves. Whether
  # it resolves on arm64 too is answered at release time, on an arm64 runner.
  #
  # No registry cache, so a release builds these a second time. `type=gha` needs ACTIONS_* in the
  # environment, which `build-push-action` injects and a plain `run:` step does not have, and
  # reaching for another action to export them would buy minutes in a job that runs rarely at the
  # price of a dependency in the one workflow whose inputs are a security boundary.
  component-dockerfiles:
    name: component dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same cost gate as `image` above, and for the same reason: `agent-computer` pulls
    # Playwright's base and `server` builds the app, so this is minutes rather than seconds. On main
    # and through the release's workflow_call it always runs.
    # #416 nightly gate prepended to the existing cost gate (same shape as every
    # other job: off the schedule and the e2e-only dispatch).
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.only-craft-preview-e2e) &&
      (
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'full-ci')
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A Dockerfile the release does not publish is one a machine would build from source, so the
      # list and the tree have to agree. Checked here rather than trusted, because the failure is
      # silent: the release succeeds and a laptop somewhere compiles the app.
      - name: Every buildable service is published
        run: |
          set -euo pipefail
          found="$(find . -mindepth 2 -maxdepth 2 -name Dockerfile -not -path './node_modules/*' \
            | sed -e 's|^\./||' -e 's|/Dockerfile$||' | sort)"
          published="$(jq -r '.[]' .github/published-images.json | sort)"
          if [ "$found" != "$published" ]; then
            echo "::error::.github/published-images.json does not match the Dockerfiles in the tree."
            diff <(echo "$published") <(echo "$found") || true
            exit 1
          fi
      - name: They build
        run: |
          set -euo pipefail
          while read -r image; do
            echo "::group::$image"
            docker buildx build --file "$image/Dockerfile" --platform linux/amd64 .
            echo "::endgroup::"
          done < <(jq -r '.[]' .github/published-images.json)
      # Building proves the Dockerfile resolves, not that the image starts. A runtime import of a file
      # the Dockerfile never copied (../../shared/file-download, from #698) built cleanly and crashed
      # on start. The computer image has no dependencies to start, so it is booted and asked for health.
      - name: The computer image starts
        run: |
          set -euo pipefail
          docker buildx build --file agent-computer/Dockerfile --platform linux/amd64 --load \
            --tag openbot-agent-computer:ci .
          docker run -d --name computer-ci -e COMPUTER_TOKEN=ci-token-0123456789abcdef \
            -p 127.0.0.1:4100:4100 openbot-agent-computer:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4100/health >/dev/null; then
              echo "agent-computer answered /health"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' computer-ci)" != "true" ]; then break; fi
            sleep 1
          done
          echo "::error::agent-computer did not answer /health"
          docker logs computer-ci || true
          exit 1

  # #416: the nightly full-stack craft-preview e2e (same-site topology + HMR +
  # Server Actions) re-run — the one job the schedule exists for. Every other
  # job carries the schedule/dispatch gate; this job runs on ubuntu-latest and
  # leans on the suite's own fail-loud preflight: until a four-stack staging
  # environment is reachable from the runner (postgres+Casdoor, agent-sandbox
  # gateway, API server, app dev server, TLS termination for same-site), the
  # CRAFT_E2E_* vars below are unset and the npm preflight exits 1 with the
  # explicit prerequisites message. A red nightly on an unconfigured
  # environment is the honest signal; a queued-forever self-hosted group or a
  # silent skip would both read as "nothing to report".
  craft-preview-e2e:
    name: craft-preview e2e (same-site + HMR + Server Actions)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The inverse of every other gate: THIS job runs on the schedule and on the
    # e2e-only dispatch, and stays off ordinary push/PR runs (the four-stack
    # cost is nightly business, not per-PR).
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.only-craft-preview-e2e)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # R2-F7 (OCR R2): the explicit TLS pipeline entry moved here from the `test` job —
      # its old step-level nightly/e2e-only condition was unreachable there (this job's
      # if is exactly that condition, and `test` carries its complement), so on any
      # event either the step or the job was skipped. This job runs only on the
      # nightly/e2e-only path, so no step-level condition is needed; running the
      # named `test:tls` entry (#407: the 30 s per-test budget for the real
      # bash/openssl/drill cases) before the acceptance suite keeps the entry
      # exercised on every run of the job whose topology it underwrites.
      - name: TLS pipeline suite (explicit entry)
        run: bun run test:tls
      - name: Run the acceptance suite against the staging stack
        env:
          # #416: the same-site topology profile (AC1 same-site step is a pass
          # class assertion there). The runner carries the four-stack staging
          # deployment: until the CRAFT_E2E_* vars/secrets below are configured
          # the npm preflight fails with the explicit prerequisites message —
          # the nightly is RED on an unconfigured environment, never silently
          # green on nothing.
          CRAFT_ACCEPTANCE_TOPOLOGY: same-site
          CRAFT_ACCEPTANCE_APP_ORIGIN: ${{ vars.CRAFT_E2E_APP_ORIGIN }}
          CRAFT_ACCEPTANCE_API_ORIGIN: ${{ vars.CRAFT_E2E_API_ORIGIN }}
          CRAFT_ACCEPTANCE_PREVIEW_ORIGIN: ${{ vars.CRAFT_E2E_PREVIEW_ORIGIN }}
          CRAFT_ACCEPTANCE_SERVER_LOG: ${{ vars.CRAFT_E2E_SERVER_LOG }}
          CRAFT_ACCEPTANCE_SANDBOX_GATEWAY: ${{ vars.CRAFT_E2E_SANDBOX_GATEWAY }}
          CRAFT_ACCEPTANCE_SANDBOX_TOKEN: ${{ secrets.CRAFT_E2E_SANDBOX_TOKEN }}
          CRAFT_ACCEPTANCE_CASDOOR_USER: ${{ vars.CRAFT_E2E_CASDOOR_USER }}
          CRAFT_ACCEPTANCE_CASDOOR_PASSWORD: ${{ secrets.CRAFT_E2E_CASDOOR_PASSWORD }}
        run: bun run test:craft-preview-e2e
      - name: Archive the evidence bundle
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: craft-preview-e2e-${{ github.run_id }}
          path: .archive/runs/craft-preview/verification/
          if-no-files-found: warn

  # One check for branch protection to require. A new job above is covered by this without anybody
  # remembering to add it to a list, and a job that was skipped for the wrong reason is not a pass.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always()
    needs: [static, deployables, computer-browser, chart, test, startup, python-harness, build, migrations, image, component-dockerfiles, submodule]
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required check reported $result"; exit 1 ;;
            esac
          done
