name: CI

on:
  pull_request:
  push:
    branches: [main]
  # #416: the nightly craft-preview full-stack e2e (same-site topology + HMR +
  # Server Actions) re-run. A scheduled event fires EVERY job in this file, so
  # every other job below carries the gate `github.event_name != 'schedule' &&
  # !(github.event_name == 'workflow_dispatch' && inputs.only-craft-preview-e2e)`
  # — the nightly runs the one job it exists for, not a second copy of the whole
  # CI bill. Manual dispatch keeps today's run-everything behaviour unless the
  # input opts into the e2e-only shape.
  schedule:
    # 19:31 UTC (03:31 +08:00) — off-peak, before the working day that would act
    # on a red nightly.
    - cron: "31 19 * * *"
  workflow_dispatch:
    inputs:
      only-craft-preview-e2e:
        description: "Run only the craft-preview e2e job (the nightly shape)"
        type: boolean
        default: false
  # Callable, so publishing a release runs these same checks against the release commit rather than
  # trusting that they ran somewhere earlier.
  workflow_call:

# Least privilege by default. Jobs that need more must declare it locally.
permissions:
  contents: read

# The newest push on a branch wins; main runs are retained for badge and release history.
# #416: scheduled and dispatched runs get their own concurrency group — a
# scheduled event's github.ref is the default branch, and without the
# event_name suffix the nightly would join the main-push group and the two
# would cancel each other.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The frontend lives in the apps/openmuse submodule (apps/openmuse-mobile was deleted), but no
  # checkout in this file asks for it — so CI has been asserting nothing about the pin. A gitlink
  # pointing at a commit the remote no longer has (rewritten history, a force push, a repo gone
  # private) merges green and only fails for the first person who runs `git submodule update --init`
  # locally. The design spec (docs/specs/superpowers/2026-10-12-openmuse-frontend-openbot-backend-
  # design.md) asks CI to at least initialize the submodule; this is that guard's cheapest form:
  # init exactly what the tree pins, then prove what got checked out is what the tree names.
  submodule:
    name: submodule pin fetchable
    runs-on: ubuntu-latest
    # #416 nightly gate: a scheduled event fires every job in this file, so every
    # other job stays off the nightly run — the schedule exists for the one
    # craft-preview-e2e job below, not a second copy of the whole CI bill.
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.only-craft-preview-e2e)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails outright when the pinned gitlink commit is not fetchable from the submodule's remote —
      # that is the dangling-pin refusal this job exists to give CI.
      - name: Initialize the pinned submodule
        run: git submodule update --init apps/openmuse
      - name: The checked-out commit is the one the tree pins
        run: |
          pinned="$(git ls-tree HEAD apps/openmuse | awk '{print $3}')"
          checked="$(git -C apps/openmuse rev-parse HEAD)"
          if [ "$pinned" != "$checked" ]; then
            echo "::error::apps/openmuse checked out $checked but the tree pins $pinned."
            exit 1
          fi

  # Formatting, linting, typing and tests are independent checks, so each reports its own result.
  static:
    name: format, lint, types
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # #416 nightly gate: a scheduled event fires every job in this file, so every
    # other job stays off the nightly run — the schedule exists for the one
    # craft-preview-e2e job below, not a second copy of the whole CI bill.
    # Skipped counts as passing for `verify`, which itself carries the same gate,
    # so the nightly run reports exactly the e2e job.
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.only-craft-preview-e2e)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checkout leaves a usable credential in the runner otherwise, which every later step and
          # every action it calls can read. Nothing here pushes.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - name: Desktop version tracks the release version
        run: bun desktop/scripts/desktop-version.ts check
      # The chart's default image tag is its appVersion, and a release must move both together. They
      # drifted once, appVersion left pointing at a tag that was never published, and a default
      # `helm install` sat in ImagePullBackOff. This refuses a tree where package.json (the last
      # version published) and the chart's appVersion have come apart.
      - name: Chart appVersion tracks the release version
        run: |
          pkg=$(bun -e 'console.log(require("./package.json").version)')
          chart=$(bun -e 'console.log(require("yaml").parse(require("fs").readFileSync("charts/openbot/Chart.yaml","utf8")).appVersion)')
          if [ "$pkg" != "$chart" ]; then
            echo "::error::package.json is $pkg but charts/openbot/Chart.yaml appVersion is $chart. The release workflow moves them together; bring them back into line."
            exit 1
          fi
      # runtime-go/dependency-review.json is the record G1b security review leans on, and its
      # go.mod/go.sum digests were entered by hand. A dependency change without a record update is
      # exactly the rescanTrigger incident mode: stale digests quietly vouch for files that moved.
      - name: Dependency review record tracks go.mod/go.sum
        run: |
          actual_mod=$(shasum -a 256 runtime-go/go.mod | cut -d' ' -f1)
          actual_sum=$(shasum -a 256 runtime-go/go.sum | cut -d' ' -f1)
          # The vulnerability scan record must anchor the current go.sum too, or a stale
          # scan silently vouches for dependencies that moved. Archived history[] digests
          # are exempt by design.
          if [ "$(jq -r '.graph.goMod.sha256' runtime-go/dependency-review.json)" != "$actual_mod" ] ||
             [ "$(jq -r '.graph.goSum.sha256' runtime-go/dependency-review.json)" != "$actual_sum" ] ||
             [ "$(jq -r '.vulnerabilityScan.scannedGoSumSha256' runtime-go/dependency-review.json)" != "$actual_sum" ] ||
             [ "$(jq -r '.graph.goMod.lines' runtime-go/dependency-review.json)" != "$(wc -l < runtime-go/go.mod | tr -d ' ')" ] ||
             [ "$(jq -r '.graph.goSum.lines' runtime-go/dependency-review.json)" != "$(wc -l < runtime-go/go.sum | tr -d ' ')" ]; then
            echo "::error::runtime-go/go.mod or go.sum moved but dependency-review.json still carries stale digests or line counts. Re-measure the graph facts and re-run govulncheck, then update the record (including vulnerabilityScan.scannedGoSumSha256)."
            exit 1
          fi

  # The two packages that are deployables in their own right rather than root workspaces. Root
  # `typecheck` is `bun run --filter '*' typecheck`, and `--filter '*'` enumerates `workspaces`, which
  # is app, server and worker. So both of these ship a `typecheck` script that nothing has ever run:
  # `agent-computer` holds the only `spawn` in the deployment and `supervisor` is the only thing
  # holding a Docker socket, which is a poor pair to leave untyped. Both are clean today, so this
  # changes nothing about main and only stops the next change being the first one a type checker sees.
  #
  # Not by adding them to `workspaces`: each is built from its own lockfile and the Dockerfile depends
  # on that, so they are installed separately here for the same reason they are installed separately
  # there. A matrix rather than two jobs, so each package reports its own result and a third one is a
  # line in the list below and nothing in `verify`, which sees the whole matrix as one entry.
  deployables:
    name: types (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # #416 nightly gate: a scheduled event fires every job in this file, so every
    # other job stays off the nightly run — the schedule exists for the one
    # craft-preview-e2e job below, not a second copy of the whole CI bill.
    # Skipped counts as passing for `verify`, which itself carries the same gate,
    # so the nightly run reports exactly the e2e job.
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.only-craft-preview-e2e)
    strategy:
      # One red package must not hide whether the other is red too.
      fail-fast: false
      matrix:
        package: [agent-computer, supervisor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # Two installs, and the root one is load-bearing. Both packages set `types: ["bun"]` in
      # their tsconfig while `@types/bun` is a root devDependency, so tsc resolves it by walking up
      # to the root node_modules. Without it the typecheck fails with TS2688 on a fresh checkout.
      # This is the order the image uses for the same reason: Dockerfile installs at the root
      # before installing agent-computer.
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: ${{ matrix.package }}
      - run: bun run typecheck
        working-directory: ${{ matrix.package }}

  # The agent-computer tests that launch a real Chromium. They are asked for by name because a
  # machine running the suite is not required to have a browser, and these are the only tests that
  # would catch a password reaching the snapshot a model reads, a session cookie lost on restart, or
  # WebRTC leaving around the egress filter. The browser is the one the computer image installs,
  # pinned by agent-computer's own lockfile.
  computer-browser:
    name: computer (real browser)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # #416 nightly gate: a scheduled event fires every job in this file, so every
    # other job stays off the nightly run — the schedule exists for the one
    # craft-preview-e2e job below, not a second copy of the whole CI bill.
    # Skipped counts as passing for `verify`, which itself carries the same gate,
    # so the nightly run reports exactly the e2e job.
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.only-craft-preview-e2e)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: agent-computer
      - run: bunx playwright install --with-deps chromium
        working-directory: agent-computer
      # Headless here: these launch through the profile path without the computer's own X server.
      # The headless run of the Web Bot Auth test is also the one that checks the user agent fix.
      - run: >-
          bunx e2e run --config e2e.unit.config.ts
          agent-computer/tests/sign-in.test.ts agent-computer/tests/session-cookies.test.ts
          agent-computer/tests/follows-popup.test.ts agent-computer/tests/demonstration-live.test.ts
          agent-computer/tests/webrtc-proxy.test.ts agent-computer/tests/web-bot-auth-browser.test.ts
          agent-computer/tests/handoff-page-restore.test.ts
        env:
          E2E_UNIT_SCOPE: agent-computer
          OPENBOT_COMPUTER_BROWSER: '1'
          OPENBOT_DEMONSTRATION_LIVE: '1'
          COMPUTER_BROWSER_MODE: headless
      # Headed is the default for hosted computers, so it is tested as one: the computer starting its
      # own Xvfb, and the signing again with cross-site frames in processes of their own.
      - run: bunx e2e run --config e2e.unit.config.ts agent-computer/tests/headed-browser.test.ts
        env:
          E2E_UNIT_SCOPE: agent-computer
          OPENBOT_HEADED_BROWSER: '1'
      - run: >-
          xvfb-run --auto-servernum bunx e2e run --config e2e.unit.config.ts
          agent-computer/tests/web-bot-auth-browser.test.ts
        env:
          E2E_UNIT_SCOPE: agent-computer
          OPENBOT_COMPUTER_BROWSER: '1'
          COMPUTER_BROWSER_MODE: headed

  chart:
    name: chart (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # #416 nightly gate: a scheduled event fires every job in this file, so every
    # other job stays off the nightly run — the schedule exists for the one
    # craft-preview-e2e job below, not a second copy of the whole CI bill.
    # Skipped counts as passing for `verify`, which itself carries the same gate,
    # so the nightly run reports exactly the e2e job.
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.only-craft-preview-e2e)
    strategy:
      # One red target must not hide whether another is red too.
      fail-fast: false
      matrix:
        target: [self-hosted, eks, eks-sandbox, gke, aks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The new-values-key check compares this chart against the last released one, or against
          # main where the chart has not shipped yet. A shallow clone has neither to compare with.
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      # For the coherence check below, which is a Bun script like everything else here.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # Nothing rendered this chart until now, which is how four values files that produce a server
      # unable to start were shipped and stayed shipped. Rendering is the cheap half; the refusals in
      # validation.yaml are the half that catches a missing value before a cluster does.
      - run: helm dependency build charts/openbot
      # Structure only. `helm lint` reports a template `fail` as an INFO line and exits 0 even under
      # `--strict`, which was driven and confirmed, so it cannot gate the refusals below. Rendering
      # does: `helm template` exits non-zero on one.
      - run: helm lint charts/openbot --values charts/openbot/ci/${{ matrix.target }}-values.yaml
      # A key encryption key is a real 32 bytes rather than a placeholder, because the chart checks
      # its shape. Generated here so no example key is ever a literal in this repository.
      - name: Render
        run: |
          helm template ci charts/openbot \
            --values charts/openbot/ci/${{ matrix.target }}-values.yaml \
            --set-string secrets.keyEncryptionKey="$(openssl rand -base64 32)" \
            --api-versions agents.x-k8s.io/v1beta1/Sandbox \
            --api-versions extensions.agents.x-k8s.io/v1beta1/SandboxTemplate \
            > rendered.yaml
      # Rendering proves the templates run. This proves the result is coherent, which is a different
      # question: every secret key a container demands has to be one the chart actually writes.
      # Getting that wrong is invisible until a pod starts, and every shipped target had it wrong.
      - run: bun scripts/check-rendered-chart.ts rendered.yaml
      # No target names a Learning credential, so the setup Job renders nowhere above. Render it with
      # one of each, and hold it to the same coherence check.
      - name: Learning setup Job renders
        run: |
          helm template ci charts/openbot \
            --values charts/openbot/ci/${{ matrix.target }}-values.yaml \
            --set-string secrets.keyEncryptionKey="$(openssl rand -base64 32)" \
            --api-versions agents.x-k8s.io/v1beta1/Sandbox \
            --api-versions extensions.agents.x-k8s.io/v1beta1/SandboxTemplate \
            --set-string config.learning.setup.cliLoginSecret.name=openbot-copilotkit-cli \
            --set-string config.learning.setup.serviceTokenSecret.name=intelligence-service-token \
            --set-string config.learning.setup.projectId=7 \
            > rendered-learning.yaml
          grep -q 'app.kubernetes.io/component: learning-setup' rendered-learning.yaml
          bun scripts/check-rendered-chart.ts rendered-learning.yaml
      # And that the refusals are load-bearing rather than decorative. A chart full of `fail`
      # messages nothing ever triggers is a chart that has never been shown to refuse anything, and
      # every one of these describes a state that shipped in a values file at some point.
      - name: Refusals fire
        run: |
          set -uo pipefail
          refuses() {
            local why="$1"; shift
            if helm template ci charts/openbot \
                 --values charts/openbot/ci/${{ matrix.target }}-values.yaml \
                 --set-string secrets.keyEncryptionKey="$(openssl rand -base64 32)" \
                 --api-versions agents.x-k8s.io/v1beta1/Sandbox \
                 --api-versions extensions.agents.x-k8s.io/v1beta1/SandboxTemplate \
                 "$@" >/dev/null 2>&1; then
              echo "::error::The chart rendered $why, which it is supposed to refuse."
              return 1
            fi
            echo "refused: $why"
          }
          # The public example key, which the server will not start with. Only where this chart
          # holds the secret: with a store, the value is not readable at template time, so the
          # refusal is deliberately not armed and asserting it here would be asserting a bug.
          if ! grep -qE '^ *enabled: true' <(sed -n '/^externalSecrets:/,/^[a-z]/p' charts/openbot/ci/${{ matrix.target }}-values.yaml); then
            refuses "the public example encryption key" \
              --set-string secrets.keyEncryptionKey="$(head -c 32 /dev/zero | base64)"
          else
            echo "skipped: the example-key refusal is not armed when the secret comes from a store"
          fi
          # A Bot endpoint with nothing on the request that says who is calling. Armed whether the
          # secret is this chart's or a store's, because the key list is readable either way.
          refuses "a managed agent URL with no token" \
            --set-string config.managedAgent.url=http://agent.default:8000/ag-ui
          # A browser inside every replica of a replicated API.
          refuses "an embedded browser across several replicas" \
            --set server.embeddedComputer=true --set server.replicaCount=2
          # A Bot's egress proxy on a port the computer's own network policy does not allow. The
          # variables reach the computer through extraEnv, so nothing else notices that the policy
          # then refuses to let it be reached.
          refuses "an egress proxy the network policy blocks" \
            --set networkPolicy.enabled=true \
            --set computers.extraEnv[0].name=EGRESS_PROXY_DEFAULT \
            --set-string computers.extraEnv[0].value=http://proxy.internal:3128
          # The residential proxy setting, whose address is a secret the template cannot read, with
          # network policies on and no path opened to it.
          refuses "a residential proxy with no path through the network policy" \
            --set networkPolicy.enabled=true --set computers.egressProxy.enabled=true \
            --set-string secrets.egressProxyUrl=http://user:pass@gateway.example:8000
          # The same setting switched on with no URL behind it, where this chart holds the secret.
          if ! grep -qE '^ *enabled: true' <(sed -n '/^externalSecrets:/,/^[a-z]/p' charts/openbot/ci/${{ matrix.target }}-values.yaml) \
             && ! grep -qE '^ *existingSecret: [^"]' <(sed -n '/^secrets:/,/^[a-z]/p' charts/openbot/ci/${{ matrix.target }}-values.yaml); then
            refuses "a residential proxy switched on with no URL" \
              --set computers.egressProxy.enabled=true
          else
            echo "skipped: the proxy URL refusal is armed only where this chart writes the Secret"
          fi
          # A delivery or directory switch with no secret behind it. Armed on every target: the chart
          # requires the value when it holds the secret, and requires the store to name the key when
          # a store does.
          refuses "OpenTag switched on with no shared secret" \
            --set config.opentag.enabled=true
          refuses "SCIM switched on with no bearer token" \
            --set config.scim.enabled=true
          refuses "a Learning service token with no project to create the container in" \
            --set-string config.learning.setup.serviceTokenSecret.name=intelligence-service-token
          # The rest are refusals the server makes at boot, mirrored so the value is named at install.
          refuses "an OpenTag URL with the pairing switched off" \
            --set-string config.opentag.url=https://opentag.example.com
          refuses "a partial set of Twilio settings" \
            --set config.sms.enabled=true --set-string secrets.twilioAuthToken=token \
            --set-string config.sms.accountSid=AC0 --set-string config.sms.verifyServiceSid=VA0
          refuses "a push project id that is not a UUID" \
            --set-string config.push.projectId=not-a-uuid
          refuses "a delivery public URL that is not http(s)" \
            --set-string config.deliveryPublicUrl=hooks.example.com
          # A warm pool nothing claims from. Only meaningful where the target asks for per-Bot
          # computers; on the others the mode is not sandbox and the refusal is not armed.
          if grep -qE '^ *mode: sandbox' charts/openbot/ci/${{ matrix.target }}-values.yaml; then
            refuses "a warm pool no Bot can be handed a computer from" \
              --set computers.sandbox.warmPool.enabled=true
          else
            echo "skipped: the warm-pool refusal is only armed for computers.mode: sandbox"
          fi
      # And that a values key this chart did not used to have still renders when it is absent.
      #
      # `helm upgrade --reuse-values` takes the previous release's computed values rather than
      # merging the new chart's defaults, so a key added by the release being installed is missing on
      # every deployment that already exists. Unguarded that is a nil dereference that fails the
      # whole render, or an empty scalar Kubernetes reads as unset. Both shipped: one was found in
      # review, the other by a live upgrade after the first had been fixed one key over.
      - name: A new values key can be absent
        run: bun scripts/check-new-values-keys.ts charts/openbot/ci/${{ matrix.target }}-values.yaml

  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # #416 nightly gate: a scheduled event fires every job in this file, so every
    # other job stays off the nightly run — the schedule exists for the one
    # craft-preview-e2e job below, not a second copy of the whole CI bill.
    # Skipped counts as passing for `verify`, which itself carries the same gate,
    # so the nightly run reports exactly the e2e job.
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.only-craft-preview-e2e)
    # The suite includes a real database integration test. Without a database it fails on every run,
    # including on main, which trains everyone to read a red CI as normal. pgvector rather than plain
    # postgres because the knowledge schema uses the extension.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: openbot_test
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: openbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d openbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      enterprise-postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: openbot_enterprise_r2_codex_20261009
          POSTGRES_USER: enterprise_setup
          POSTGRES_PASSWORD: enterprise-setup-only
        ports:
          - "127.0.0.1:5434:5432"
        options: >-
          --health-cmd "pg_isready -U enterprise_setup -d openbot_enterprise_r2_codex_20261009"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The ME01/ME03/ME05 fixtures build disposable databases + restricted roles
      # through server/tests/support/pg-container.ts. Locally that shells into the
      # `openbot-test-pg` container; here there is no docker socket, so the fixtures
      # take the wire path against this superuser DSN instead.
      me-postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: openbot
        ports:
          - "127.0.0.1:5433:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://openbot:openbot@localhost:5432/openbot_test
      TEST_DATABASE_URL: postgres://openbot:openbot@localhost:5432/openbot_test
      ENTERPRISE_TEST_SETUP_DATABASE_URL: postgres://enterprise_setup:enterprise-setup-only@127.0.0.1:5434/openbot_enterprise_r2_codex_20261009
      ENTERPRISE_TEST_DIRECTORY_DATABASE_URL: postgres://enterprise_directory_login:enterprise-test-only@127.0.0.1:5434/openbot_enterprise_r2_codex_20261009?options=-c%20role%3Dob_ent_directory
      ENTERPRISE_TEST_DATA_DATABASE_URL: postgres://enterprise_data_login:enterprise-test-only@127.0.0.1:5434/openbot_enterprise_r2_codex_20261009?options=-c%20role%3Dob_ent_data
      ENTERPRISE_TEST_OPERATOR_DATABASE_URL: postgres://enterprise_operator_login:enterprise-test-only@127.0.0.1:5434/openbot_enterprise_r2_codex_20261009?options=-c%20role%3Dob_ent_operator
      # Handed only to the multitenancy groups by tests/bun-suites.test.ts; see the provisioning step below.
      MT_TEST_DATABASE_URL: postgres://openbot:openbot@localhost:5432/openbot_enterprise_mt_test
      # The billing island's own database (see EXPLICIT_GROUPS in scripts/lib/e2e-manifest.mjs for
      # why the payment/billing family cannot share openbot_test); provisioned in the step below.
      BILLING_TEST_DATABASE_URL: postgres://openbot:openbot@localhost:5432/openbot_billing_test
      # Wire path for the ME fixtures' disposable-database bootstrap (see the
      # me-postgres service above); ME01_TEST_PG_PORT already defaults to 5433.
      ME01_TEST_PG_ADMIN_DSN: postgres://postgres:openbot@127.0.0.1:5433/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The entrypoint enumeration's anchors are code evidence: they name lines
      # inside the bifrost submodule, so this job holds its pinned commit (the
      # same initialize-the-pinned-submodule shape the submodule jobs use).
      - name: Initialize the pinned bifrost submodule
        run: git submodule update --init bifrost
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # The Bots are not root workspaces and each keeps its own lockfile. The startup tests spawn
      # the real entrypoint, so its dependencies have to be installed as well.
      - run: bun install --frozen-lockfile
        working-directory: agent-bot
      # Same for the LangGraph Bot: its history tests import @langchain/core, which lives in that
      # Bot's own tree and not in the root one.
      - run: bun install --frozen-lockfile
        working-directory: agent-langgraph
      # Same for the computer: its Web Bot Auth tests import `web-bot-auth`, which lives in
      # agent-computer's own tree and not in the root one.
      - run: bun install --frozen-lockfile
        working-directory: agent-computer
      # Same for the Mastra Bot: root test discovery imports its receiver tests, which load Mastra
      # from that Bot's own dependency tree.
      - run: bun install
        working-directory: agent-mastra
      # Same for the desktop app: root test discovery imports its React tests, whose JSX runtime is
      # pinned by the desktop lockfile rather than the root one.
      - run: bun install --frozen-lockfile
        working-directory: desktop
      # CI owns this disposable database and opts into the same role bootstrap as local Compose.
      - run: bun scripts/migrate.ts
        working-directory: server
        env:
          OPENBOT_BOOTSTRAP_ENTERPRISE_ROLES: "on"
      # The second service is fresh and isolated from the regular test database. Prove a missing-role
      # migration fails before DDL, then bootstrap and migrate it through the reserved test wrapper.
      # The multitenancy suites create their own schema through
      # server/scripts/multitenancy/migrate-test.ts, whose gate refuses any TEST_DATABASE_URL whose
      # database is not named openbot_enterprise_* on a loopback host. Pointed at openbot_test, all 51 of
      # them abort during collection, so the run reports a red group that executed zero tests — a failure
      # nobody can read. Give them a database their own gate accepts and migrate that one too:
      # tests/bun-suites.test.ts passes MT_TEST_DATABASE_URL to those groups only, so every other suite
      # keeps openbot_test. Verified locally against the same image: the group goes from no tests
      # executed at all to 293 cases.
      - name: Provision the multitenancy test database
        working-directory: server
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE openbot_enterprise_mt_test'
          DATABASE_URL="$MT_TEST_DATABASE_URL" TEST_DATABASE_URL="$MT_TEST_DATABASE_URL" \
            OPENBOT_BOOTSTRAP_ENTERPRISE_ROLES=on bun scripts/migrate.ts
          # The drizzle chain (0163/0209/0210/0215) pre-creates MT-task tables on a
          # fully migrated database — without their RLS/GRANT. The task apply adopts
          # those tables instead of refusing them (CREATE TABLE expands to per-column
          # ADD COLUMN IF NOT EXISTS plus drop-then-add constraints; indexes, policies
          # and constraints drop their same-named leftovers first), so the drizzle
          # columns survive and the task shape fills in RLS/GRANT around them.
          DATABASE_URL="$MT_TEST_DATABASE_URL" TEST_DATABASE_URL="$MT_TEST_DATABASE_URL" \
            bun scripts/multitenancy/migrate-test.ts migrate all --apply --adopt-existing
      # Same shape as the multitenancy step: the billing island's suites refuse
      # nothing on openbot_test, but a single leftover pending payment_orders row
      # (deployment-global guard, store.ts) reddens the whole family — give them
      # a database no other suite touches.
      - name: Provision the billing island test database
        working-directory: server
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE openbot_billing_test'
          DATABASE_URL="$BILLING_TEST_DATABASE_URL" TEST_DATABASE_URL="$BILLING_TEST_DATABASE_URL" \
            OPENBOT_BOOTSTRAP_ENTERPRISE_ROLES=on bun scripts/migrate.ts
      - name: Enterprise migration preflight and role-safety fixture
        run: bunx e2e run --config e2e.unit.config.ts server/tests/enterprise/migration-role-preflight.integration.test.ts
        env:
          E2E_UNIT_SCOPE: server
          ENTERPRISE_TEST_PREFLIGHT_MODE: fresh
      - name: Prepare the enterprise test database
        working-directory: server
        run: |
          bun scripts/enterprise-test-db.ts migrate
          # Same shape as the multitenancy step above: the drizzle chain
          # pre-creates the MT-task tables without their RLS/GRANT. The
          # enterprise suites do NOT apply the task chain themselves (unlike
          # the multitenancy groups), so provision the whole chain here,
          # adopting the drizzle-created tables and filling in the task shape.
          DATABASE_URL="$ENTERPRISE_TEST_SETUP_DATABASE_URL" TEST_DATABASE_URL="$ENTERPRISE_TEST_SETUP_DATABASE_URL" \
            bun scripts/multitenancy/migrate-test.ts migrate all --apply --adopt-existing
      # A passing job must include the expected test floor. Import-time failures can otherwise skip
      # files before their tests are registered.
      - run: bun run test:ci
      # #407 + F6 (OCR R1): the TLS pipeline suite is already driven by `test:ci` above
      # (tests/config/e2e-bun-suites.json drives scripts/tls-pipeline.test.ts). The explicit
      # `test:tls` entry used to live here behind a step-level nightly/e2e-only condition that
      # was unreachable — this job's if is the exact complement of that condition. R2-F7 (OCR R2)
      # moved the explicit entry into the craft-preview-e2e job, which runs only on that path.

  startup:
    name: startup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # #416 nightly gate: a scheduled event fires every job in this file, so every
    # other job stays off the nightly run — the schedule exists for the one
    # craft-preview-e2e job below, not a second copy of the whole CI bill.
    # Skipped counts as passing for `verify`, which itself carries the same gate,
    # so the nightly run reports exactly the e2e job.
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.only-craft-preview-e2e)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx e2e run --config e2e.unit.config.ts tests/bun-suites.test.ts
        env:
          E2E_BUN_ONLY: app/tests/build-cache.test.ts

  python-harness:
    name: python harness regressions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # #416 nightly gate: a scheduled event fires every job in this file, so every
    # other job stays off the nightly run — the schedule exists for the one
    # craft-preview-e2e job below, not a second copy of the whole CI bill.
    # Skipped counts as passing for `verify`, which itself carries the same gate,
    # so the nightly run reports exactly the e2e job.
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.only-craft-preview-e2e)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
