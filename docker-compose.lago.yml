# Lago, the billing provider OpenBot's billing seam talks to when a deployment configures
# LAGO_API_URL and friends — split out of docker-compose.yml (one file per service group).
#
# START THE MAIN STACK FIRST: these services share the `data` network and reach postgres by
# service name, and postgres lives in docker-compose.yml. Cross-file `depends_on` is not a
# thing Compose resolves, so the postgres dependencies the single file used to carry are gone;
# the restart policies below absorb the gap instead (a Lago container that starts before
# postgres is ready crash-loops briefly and then comes up). `lago-migrate` is the one-shot
# exception — it exits on a dead database rather than retrying, so run it after postgres is
# healthy (which `up -d` with a healthy main stack already is).
#
# Same project name as the main file on purpose: volumes and networks keep their openbot_*
# names, so a stack that ran under the single file keeps its data (lago-redis-data,
# lago-storage-data) without any migration step.
#
# Images digest-pinned to getlago/lago v1.53.0, the release OpenBot's client and webhook
# verifier were integration-tested against. Partman-less on purpose; see
# docker/lago/init-db.sql for what that trades away and why.
name: openbot

# The Lago backend services' shared environment. Secrets never live here: they come from
# docker/lago/.env (generated by docker/lago/init-env.sh) through each service's `env_file`.
# The database is the shared postgres service in docker-compose.yml, through a dedicated
# `lago` database and login role (docker/lago/init-db.sql mounts into that service's
# docker-entrypoint-initdb.d).
x-lago-backend-environment: &lago-backend-environment
  DATABASE_URL: postgresql://lago:lago@postgres:5432/lago
  REDIS_URL: redis://lago-redis:6379
  LAGO_REDIS_CACHE_URL: redis://lago-redis:6379
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  LAGO_API_URL: http://127.0.0.1:${LAGO_API_PORT:-48889}
  LAGO_FRONT_URL: http://127.0.0.1:${LAGO_FRONT_PORT:-48890}
  LAGO_PDF_URL: http://lago-pdf:3000
  LAGO_SIDEKIQ_WEB: "true"
  LAGO_USE_AWS_S3: "false"
  LAGO_USE_GCS: "false"
  LAGO_DISABLE_SIGNUP: "false"
  LAGO_DISABLE_PDF_GENERATION: "false"
  LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com

services:
  lago-redis:
    image: redis@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    restart: unless-stopped
    command: --port 6379
    volumes:
      - lago-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  lago-pdf:
    image: getlago/lago-gotenberg@sha256:e8eef6fb4a92a3440c70d06598b385e7eb2ec7fb2d9b908ca4aa028741a0b270
    restart: unless-stopped
    networks:
      - data

  # One-shot: runs Lago's migrations against the lago schema, and on the very first boot also
  # mints the operator account and organization API key from the LAGO_ORG_* seed values in
  # docker/lago/.env. Needs the main stack's postgres healthy first (see the header).
  lago-migrate:
    image: getlago/api@sha256:4d1001772009beea6348b95b24938c3c289574516a312b1c191e83adbb546c8b
    command: ["./scripts/migrate.sh"]
    env_file: ./docker/lago/.env
    environment: *lago-backend-environment
    restart: "no"
    networks:
      - data

  lago-api:
    image: getlago/api@sha256:4d1001772009beea6348b95b24938c3c289574516a312b1c191e83adbb546c8b
    restart: unless-stopped
    command: ["./scripts/start.api.sh"]
    env_file: ./docker/lago/.env
    environment: *lago-backend-environment
    volumes:
      - lago-storage-data:/app/storage
    ports:
      # Loopback, like every other port in these files. This is the LAGO_API_URL a deployment
      # configures on OpenBot's side; the browser-only frontend is the port below.
      - "127.0.0.1:${LAGO_API_PORT:-48889}:3000"
      - "[::1]:${LAGO_API_PORT:-48889}:3000"
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 30s
    networks:
      - data

  lago-front:
    image: getlago/front@sha256:16646b2b1c834f110e57e3460d09cf24c7a487ced721f50f5886d65d4d6228af
    restart: unless-stopped
    environment:
      API_URL: http://127.0.0.1:${LAGO_API_PORT:-48889}
      APP_ENV: production
      LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
      LAGO_DISABLE_PDF_GENERATION: "false"
    ports:
      - "127.0.0.1:${LAGO_FRONT_PORT:-48890}:80"
      - "[::1]:${LAGO_FRONT_PORT:-48890}:80"
    depends_on:
      lago-api:
        condition: service_healthy
    networks:
      - data

  lago-worker:
    image: getlago/api@sha256:4d1001772009beea6348b95b24938c3c289574516a312b1c191e83adbb546c8b
    restart: unless-stopped
    command: ["./scripts/start.worker.sh"]
    env_file: ./docker/lago/.env
    environment: *lago-backend-environment
    volumes:
      - lago-storage-data:/app/storage
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 30s
    networks:
      - data

  lago-clock:
    image: getlago/api@sha256:4d1001772009beea6348b95b24938c3c289574516a312b1c191e83adbb546c8b
    restart: unless-stopped
    command: ["./scripts/start.clock.sh"]
    env_file: ./docker/lago/.env
    environment: *lago-backend-environment
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-redis:
        condition: service_healthy
    networks:
      - data

networks:
  # The same `data` network docker-compose.yml declares (same project name), so these
  # services reach the main stack's postgres by service name.
  data:

volumes:
  lago-redis-data:
  lago-storage-data:
