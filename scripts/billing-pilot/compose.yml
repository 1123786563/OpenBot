services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: openbot
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: pilot-only
    healthcheck:
      test: [CMD, pg_isready, -U, openbot, -d, openbot]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - data:/var/lib/postgresql/data

  migrate:
    image: ${PILOT_IMAGE:?Set PILOT_IMAGE from the build record}
    pull_policy: never
    command: [bun, scripts/migrate.ts]
    environment:
      DATABASE_URL: postgres://openbot:pilot-only@postgres:5432/openbot
    depends_on:
      postgres:
        condition: service_healthy

  fixture:
    image: oven/bun:1.4.3
    command: [bun, /fixture.mjs]
    volumes:
      - ./fixture.mjs:/fixture.mjs:ro

  server:
    image: ${PILOT_IMAGE:?Set PILOT_IMAGE from the build record}
    pull_policy: never
    environment:
      NODE_ENV: development
      COPILOTKIT_TELEMETRY_DISABLED: 'true'
      DATABASE_URL: postgres://openbot:pilot-only@postgres:5432/openbot
      KEY_ENCRYPTION_KEY: ${PILOT_ENCRYPTION_KEY:?Generate an isolated encryption key}
      OPENBOT_SINGLE_USER: 'true'
      INTELLIGENCE_API_URL: http://fixture:4200
      INTELLIGENCE_GATEWAY_WS_URL: ws://fixture:4200
      INTELLIGENCE_API_KEY: cpk-offline-fixture
      MANAGED_AGENT_AG_UI_URL: http://fixture:4200/ag-ui
      MANAGED_AGENT_TOKEN: pilot-offline-agent
      WORKER_SHARED_SECRET: pilot-offline-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      fixture:
        condition: service_started
    healthcheck:
      test: [CMD, bun, -e, "const response = await fetch('http://127.0.0.1:3001/health'); process.exit(response.ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30

  worker:
    image: ${PILOT_IMAGE:?Set PILOT_IMAGE from the build record}
    pull_policy: never
    command: [bun, ../worker/src/index.ts]
    environment:
      DATABASE_URL: postgres://openbot:pilot-only@postgres:5432/openbot
      SERVER_INTERNAL_URL: http://server:3001
      WORKER_SHARED_SECRET: pilot-offline-worker
    depends_on:
      server:
        condition: service_healthy

networks:
  default:
    internal: true

volumes:
  data:
