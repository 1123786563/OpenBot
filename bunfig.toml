[test]
# All of these make the module graph deterministic, so a test file cannot pass or fail depending on
# the order the suite happened to be walked. See server/scripts/test-preload.ts, which evaluates an
# ESM-only dependency before anything requires it, and app/tests/preload.ts, which evaluates Base UI
# while a DOM exists so its layout effect is not a no-op for every file that follows.
#
# This applies to `bun test` run from the repository root. Bun reads bunfig.toml from the current
# working directory only, so server/bunfig.toml repeats the declaration for `bun test` run from
# inside server/, and server/tests/bunfig-preload.test.ts keeps the two in agreement.
#
# Test DISCOVERY is not scoped here and no longer by package.json either: `bun run test` hands the
# corpus to e2e (`e2e.unit.config.ts`), whose globs come from the 14 directories in
# `scripts/lib/e2e-manifest.mjs` SUITE_DIRS — the same list the coverage audit reconciles against, so
# neither side can quietly widen or narrow what "every test is on e2e" means. Those globs are of the
# form `app/**`, never `app*`: apps/openmuse is a git submodule with 49 of its own suite files at
# depth ≤ 3 (verified against an initialized checkout — 60+ before), and a prefix that also matched
# `apps/` would run the submodule's tests under this repo's install, with the submodule's toolchain
# missing. biome excludes the path for the same reason. The old `bun test` entry needed path-anchored
# "./dir" filters because a bare name is a substring match over full test paths; that trap is gone
# with the entry, and the whole-corpus run now reporting 598 files rather than ~650 is the check that
# the glob really stops at the submodule.
#
# These preloads still apply, because e2e schedules 455 of those files onto `bun test` itself
# (tests/bun-suites.test.ts, ADR 0008's second tier) and Bun reads this file for that process.
preload = ["./server/scripts/test-preload.ts", "./app/tests/preload.ts"]
preload = ["./server/scripts/test-preload.ts", "./app/tests/preload.ts"]
