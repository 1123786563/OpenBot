name: openbot-bifrost

services:
  bifrost:
    image: ${BIFROST_IMAGE:-maximhq/bifrost:v2.6.0@sha256:5968d007ba4f74ee01bc4ceb071decb9927a0b7bb43dbb9072208f75e2d522e3}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:?Set BIFROST_SETUP_TOKEN}
      BIFROST_DB_HOST: ${BIFROST_DB_HOST:?Set BIFROST_DB_HOST}
      BIFROST_DB_PORT: ${BIFROST_DB_PORT:-5432}
      BIFROST_DB_NAME: ${BIFROST_DB_NAME:-bifrost}
      BIFROST_DB_USER: ${BIFROST_DB_USER:-bifrost}
      BIFROST_DB_PASSWORD: ${BIFROST_DB_PASSWORD:?Set BIFROST_DB_PASSWORD}
      BIFROST_DB_SSL_MODE: ${BIFROST_DB_SSL_MODE:-require}
    volumes:
      - bifrost-data:/app/data
      - ./bifrost.json:/app/data/config.json:ro
    networks: [bifrost]

  registry-proxy:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    depends_on: [bifrost]
    volumes:
      - ./registry-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./publication-freeze.d:/etc/nginx/publication-freeze.d:ro
    ports:
      - "127.0.0.1:${BIFROST_PORT:-18080}:8080"
    networks: [bifrost]

networks:
  bifrost:

volumes:
  bifrost-data:
    name: ${BIFROST_VOLUME:-openbot-middleware_bifrost-data}
