map $http_upgrade $bifrost_connection {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    client_max_body_size 32m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bifrost_upstream http://bifrost:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $bifrost_connection;
    proxy_buffering off;
    proxy_read_timeout 300s;

    location / {
        proxy_pass $bifrost_upstream;
    }

    location ^~ /api/skills {
        include /etc/nginx/publication-freeze.d/*.conf;
        proxy_pass $bifrost_upstream;
    }
}
