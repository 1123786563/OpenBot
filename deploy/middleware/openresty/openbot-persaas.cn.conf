map $http_origin $openbot_persaas_origin {
    default $http_origin;
    "http://persaas.cn" "http://127.0.0.1:18001";
}

map $http_upgrade $openbot_persaas_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name persaas.cn;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    location / {
        proxy_pass http://openbot_local;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:18001;
        proxy_set_header Origin $openbot_persaas_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $openbot_persaas_connection;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
