map $http_upgrade $openbot_middleware_connection {
    default upgrade;
    '' close;
}


server {
    listen 80;
    server_name bifrost.persaas.cn;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    client_max_body_size 32m;

    location ^~ /api/skills {
        return 404;
    }

    location / {
        include /www/openbot-middleware/proxy-headers.conf;
        proxy_pass http://127.0.0.1:18080;
    }
}

server {
    listen 80;
    server_name openobserve.persaas.cn;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    client_max_body_size 32m;

    location / {
        include /www/openbot-middleware/proxy-headers.conf;
        proxy_pass http://127.0.0.1:15080;
    }
}

server {
    listen 80;
    server_name otel.persaas.cn;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    access_log off;
    client_max_body_size 1m;

    location = /v1/logs {
        include /www/openbot-middleware/private/otlp-token.conf;

        if ($request_method != POST) { return 405; }
        if ($http_authorization != $openbot_otlp_authorization) { return 401; }

        include /www/openbot-middleware/proxy-headers.conf;
        proxy_set_header Authorization "";
        proxy_pass http://127.0.0.1:14318;
    }

    location / {
        return 404;
    }
}
