name: openbot-otel-collector

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    restart: unless-stopped
    # Docker JSON logs are readable only by root on the default Docker setup.
    # The container receives a read-only mount and does not need write access.
    user: "0:0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      OPENBOT_DEPLOYMENT_ID: ${OPENBOT_DEPLOYMENT_ID:?Set OPENBOT_DEPLOYMENT_ID}
      OPENBOT_OTEL_EXPORT: ${OPENBOT_OTEL_EXPORT:-on}
      OPENBOT_RUNTIME_LOG_GLOB: ${OPENBOT_RUNTIME_LOG_GLOB:-/runtime-logs/*/*.log}
      OPENBOT_DOCKER_LOG_GLOB: ${OPENBOT_DOCKER_LOG_GLOB:-/docker-containers/*/*-json.log}
      OPENBOT_RUNTIME_COMPONENT: ${OPENBOT_RUNTIME_COMPONENT:-api}
      OPENOBSERVE_OTLP_LOGS_URL: ${OPENOBSERVE_OTLP_LOGS_URL:?Set OPENOBSERVE_OTLP_LOGS_URL}
      OPENOBSERVE_RUNTIME_AUTHORIZATION: ${OPENOBSERVE_RUNTIME_AUTHORIZATION:-}
      OPENOBSERVE_AUDIT_AUTHORIZATION: ${OPENOBSERVE_AUDIT_AUTHORIZATION:-}
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_PORT:-14318}:4318"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ${OPENBOT_RUNTIME_LOG_DIR:-./runtime-logs}:/runtime-logs:ro
      - /var/lib/docker/containers:/docker-containers:ro
    networks: [otel-collector]

networks:
  otel-collector:
