name: openbot-skillhub

x-skillhub-server-image: &server-image ghcr.io/iflytek/skillhub-server:v0.2.28

services:
  web:
    image: ghcr.io/iflytek/skillhub-web:v0.2.28
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SKILLHUB_WEB_PORT:-18090}:80"
    environment:
      SKILLHUB_API_UPSTREAM: http://server:8080
      SKILLHUB_PUBLIC_BASE_URL: ${SKILLHUB_PUBLIC_BASE_URL:?set SKILLHUB_PUBLIC_BASE_URL}
      SKILLHUB_TRUST_FORWARDED_PROTO: "true"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  server:
    image: *server-image
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SKILLHUB_DATABASE_JDBC_URL:?set SKILLHUB_DATABASE_JDBC_URL}
      SPRING_DATASOURCE_USERNAME: ${SKILLHUB_DATABASE_USER:-skillhub}
      SPRING_DATASOURCE_PASSWORD: ${SKILLHUB_DATABASE_PASSWORD:?set SKILLHUB_DATABASE_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SKILLHUB_PUBLIC_BASE_URL: ${SKILLHUB_PUBLIC_BASE_URL:?set SKILLHUB_PUBLIC_BASE_URL}
      SESSION_COOKIE_SECURE: ${SKILLHUB_SESSION_COOKIE_SECURE:-true}
      SKILLHUB_DOWNLOAD_ANON_COOKIE_SECRET: ${SKILLHUB_DOWNLOAD_ANON_COOKIE_SECRET:?set SKILLHUB_DOWNLOAD_ANON_COOKIE_SECRET}
      SKILLHUB_STORAGE_PROVIDER: local
      STORAGE_BASE_PATH: /var/lib/skillhub/storage
      SKILLHUB_SECURITY_SCANNER_ENABLED: "true"
      SKILLHUB_SECURITY_SCANNER_URL: http://skill-scanner:8000
      SKILLHUB_SECURITY_SCANNER_MODE: upload
      SKILLHUB_BUILTIN_SKILLS_ENABLED: "false"
      BOOTSTRAP_ADMIN_ENABLED: ${SKILLHUB_BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_ADMIN_PASSWORD: ${SKILLHUB_BOOTSTRAP_ADMIN_PASSWORD:?set SKILLHUB_BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${SKILLHUB_BOOTSTRAP_ADMIN_EMAIL:?set SKILLHUB_BOOTSTRAP_ADMIN_EMAIL}
    volumes:
      - skillhub_storage:/var/lib/skillhub/storage
    networks: [default, postgres]
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      skill-scanner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  skill-scanner:
    image: ghcr.io/iflytek/skillhub-scanner:v0.2.28
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-permissions:
    image: *server-image
    user: "0:0"
    entrypoint: ["chown", "100:101", "/var/lib/skillhub/storage"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes:
      - skillhub_storage:/var/lib/skillhub/storage

networks:
  postgres:
    external: true
    name: ${SKILLHUB_POSTGRES_NETWORK:-1panel-network}

volumes:
  skillhub_storage:
  redis_data:
