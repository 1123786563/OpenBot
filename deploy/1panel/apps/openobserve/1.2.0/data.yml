additionalProperties:
  formFields:
    - envKey: PANEL_APP_PORT_HTTP
      type: number
      default: 15080
      required: true
      edit: true
      rule: paramPort
      label:
        en: HTTP port (Required)
        es-es: HTTP port (Obligatorio)
        ja: HTTP port (必須)
        ms: HTTP port (Wajib)
        pt-br: HTTP port (Obrigatório)
        ru: HTTP port (Обязательно)
        ko: HTTP port (필수)
        zh-Hant: HTTP port（必填）
        zh: HTTP port（必填）
        tr: HTTP port (Zorunlu)
    - envKey: PANEL_DB_HOST
      type: service
      default: ""
      required: true
      label:
        en: Existing PostgreSQL instance (Required)
        es-es: Existing PostgreSQL instance (Obligatorio)
        ja: Existing PostgreSQL instance (必須)
        ms: Existing PostgreSQL instance (Wajib)
        pt-br: Existing PostgreSQL instance (Obrigatório)
        ru: Existing PostgreSQL instance (Обязательно)
        ko: Existing PostgreSQL instance (필수)
        zh-Hant: 現有 PostgreSQL 執行個體（必填）
        zh: 已有 PostgreSQL 实例（必填）
        tr: Existing PostgreSQL instance (Zorunlu)
      key: postgresql
    - envKey: PANEL_DB_NAME
      type: text
      default: openobserve
      random: true
      required: true
      label:
        en: Database name (Required)
        es-es: Database name (Obligatorio)
        ja: Database name (必須)
        ms: Database name (Wajib)
        pt-br: Database name (Obrigatório)
        ru: Database name (Обязательно)
        ko: Database name (필수)
        zh-Hant: 資料庫名稱（必填）
        zh: 数据库名（必填）
        tr: Database name (Zorunlu)
      rule: paramCommon
    - envKey: PANEL_DB_USER
      type: text
      default: openobserve
      random: true
      required: true
      label:
        en: Database user (Required)
        es-es: Database user (Obligatorio)
        ja: Database user (必須)
        ms: Database user (Wajib)
        pt-br: Database user (Obrigatório)
        ru: Database user (Обязательно)
        ko: Database user (필수)
        zh-Hant: 資料庫使用者（必填）
        zh: 数据库用户（必填）
        tr: Database user (Zorunlu)
      rule: paramCommon
    - envKey: PANEL_DB_USER_PASSWORD
      type: password
      default: OpenObserve
      random: true
      required: true
      label:
        en: Database password (Required)
        es-es: Database password (Obligatorio)
        ja: Database password (必須)
        ms: Database password (Wajib)
        pt-br: Database password (Obrigatório)
        ru: Database password (Обязательно)
        ko: Database password (필수)
        zh-Hant: 資料庫密碼（必填）
        zh: 数据库密码（必填）
        tr: Database password (Zorunlu)
    - envKey: DB_URI_PASSWORD
      type: password
      default: ""
      required: false
      label:
        en: URL-encoded database password (if needed)
        es-es: URL-encoded database password (if needed)
        ja: URL-encoded database password (if needed)
        ms: URL-encoded database password (if needed)
        pt-br: URL-encoded database password (if needed)
        ru: URL-encoded database password (if needed)
        ko: URL-encoded database password (if needed)
        zh-Hant: URL 編碼後的資料庫密碼（含特殊字元時填寫）
        zh: URL 编码后的数据库密码（含特殊字符时填写）
        tr: URL-encoded database password (if needed)
    - envKey: DB_SSL_MODE
      type: select
      default: disable
      required: true
      label:
        en: PostgreSQL TLS mode (Required)
        es-es: PostgreSQL TLS mode (Obligatorio)
        ja: PostgreSQL TLS mode (必須)
        ms: PostgreSQL TLS mode (Wajib)
        pt-br: PostgreSQL TLS mode (Obrigatório)
        ru: PostgreSQL TLS mode (Обязательно)
        ko: PostgreSQL TLS mode (필수)
        zh-Hant: PostgreSQL TLS 模式（必填）
        zh: PostgreSQL TLS 模式（必填）
        tr: PostgreSQL TLS mode (Zorunlu)
      values:
        - label: disable
          value: disable
        - label: require
          value: require
        - label: verify-full
          value: verify-full
    - envKey: PANEL_APP_PORT_OTLP
      type: number
      default: 14318
      required: true
      edit: true
      rule: paramPort
      label:
        en: OTLP port (Required)
        es-es: OTLP port (Obligatorio)
        ja: OTLP port (必須)
        ms: OTLP port (Wajib)
        pt-br: OTLP port (Obrigatório)
        ru: OTLP port (Обязательно)
        ko: OTLP port (필수)
        zh-Hant: OTLP port（必填）
        zh: OTLP port（必填）
        tr: OTLP port (Zorunlu)
    - envKey: OPENOBSERVE_ROOT_EMAIL
      type: text
      default: ""
      required: true
      label:
        en: OpenObserve admin email (Required)
        es-es: OpenObserve admin email (Obligatorio)
        ja: OpenObserve admin email (必須)
        ms: OpenObserve admin email (Wajib)
        pt-br: OpenObserve admin email (Obrigatório)
        ru: OpenObserve admin email (Обязательно)
        ko: OpenObserve admin email (필수)
        zh-Hant: OpenObserve admin email（必填）
        zh: OpenObserve admin email（必填）
        tr: OpenObserve admin email (Zorunlu)
    - envKey: OPENOBSERVE_ROOT_PASSWORD
      type: password
      default: ""
      required: true
      label:
        en: OpenObserve admin password (Required; 8-128 characters with upper and lower case letters, a digit and a special character, or the container cannot start)
        es-es: OpenObserve admin password (Obligatorio; 8-128 characters with upper and lower case letters, a digit and a special character, or the container cannot start)
        ja: OpenObserve admin password (必須; 8-128 characters with upper and lower case letters, a digit and a special character, or the container cannot start)
        ms: OpenObserve admin password (Wajib; 8-128 characters with upper and lower case letters, a digit and a special character, or the container cannot start)
        pt-br: OpenObserve admin password (Obrigatório; 8-128 characters with upper and lower case letters, a digit and a special character, or the container cannot start)
        ru: OpenObserve admin password (Обязательно; 8-128 characters with upper and lower case letters, a digit and a special character, or the container cannot start)
        ko: OpenObserve admin password (필수; 8-128 characters with upper and lower case letters, a digit and a special character, or the container cannot start)
        zh-Hant: OpenObserve 管理员密码（必填；8-128 位，须同时含大小写字母、数字和特殊字符，否则容器无法启动）
        zh: OpenObserve 管理员密码（必填；8-128 位，须同时含大小写字母、数字和特殊字符，否则容器无法启动）
        tr: OpenObserve admin password (Zorunlu; 8-128 characters with upper and lower case letters, a digit and a special character, or the container cannot start)
    - envKey: OPENBOT_DEPLOYMENT_ID
      type: text
      default: openbot
      required: true
      edit: true
      label:
        en: OpenBot deployment ID (Required)
        es-es: OpenBot deployment ID (Obligatorio)
        ja: OpenBot deployment ID (必須)
        ms: OpenBot deployment ID (Wajib)
        pt-br: OpenBot deployment ID (Obrigatório)
        ru: OpenBot deployment ID (Обязательно)
        ko: OpenBot deployment ID (필수)
        zh-Hant: OpenBot deployment ID（必填）
        zh: OpenBot deployment ID（必填）
        tr: OpenBot deployment ID (Zorunlu)
    - envKey: OPENBOT_OTEL_EXPORT
      type: text
      default: off
      required: true
      edit: true
      label:
        en: Export logs on or off (Required)
        es-es: Export logs on or off (Obligatorio)
        ja: Export logs on or off (必須)
        ms: Export logs on or off (Wajib)
        pt-br: Export logs on or off (Obrigatório)
        ru: Export logs on or off (Обязательно)
        ko: Export logs on or off (필수)
        zh-Hant: Export logs on or off（必填）
        zh: Export logs on or off（必填）
        tr: Export logs on or off (Zorunlu)
    - envKey: OPENOBSERVE_RUNTIME_AUTHORIZATION
      type: password
      default: ""
      required: false
      edit: true
      label:
        en: Runtime ingestion authorization
        es-es: Runtime ingestion authorization
        ja: Runtime ingestion authorization
        ms: Runtime ingestion authorization
        pt-br: Runtime ingestion authorization
        ru: Runtime ingestion authorization
        ko: Runtime ingestion authorization
        zh-Hant: Runtime ingestion authorization
        zh: Runtime ingestion authorization
        tr: Runtime ingestion authorization
    - envKey: OPENOBSERVE_AUDIT_AUTHORIZATION
      type: password
      default: ""
      required: false
      edit: true
      label:
        en: Audit ingestion authorization
        es-es: Audit ingestion authorization
        ja: Audit ingestion authorization
        ms: Audit ingestion authorization
        pt-br: Audit ingestion authorization
        ru: Audit ingestion authorization
        ko: Audit ingestion authorization
        zh-Hant: Audit ingestion authorization
        zh: Audit ingestion authorization
        tr: Audit ingestion authorization
