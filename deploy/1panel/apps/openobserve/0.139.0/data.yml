additionalProperties:
  formFields:
    - envKey: PANEL_APP_PORT_HTTP
      type: number
      default: 15080
      required: true
      rule: paramPort
      label:
        en: HTTP port
        es-es: HTTP port
        ja: HTTP port
        ms: HTTP port
        pt-br: HTTP port
        ru: HTTP port
        ko: HTTP port
        zh-Hant: HTTP port
        zh: HTTP port
        tr: HTTP port
    - envKey: PANEL_DB_HOST
      type: service
      default: ""
      required: true
      label:
        en: Existing PostgreSQL instance
        es-es: Existing PostgreSQL instance
        ja: Existing PostgreSQL instance
        ms: Existing PostgreSQL instance
        pt-br: Existing PostgreSQL instance
        ru: Existing PostgreSQL instance
        ko: Existing PostgreSQL instance
        zh-Hant: 現有 PostgreSQL 執行個體
        zh: 已有 PostgreSQL 实例
        tr: Existing PostgreSQL instance
      key: postgresql
    - envKey: DB_NAME
      type: text
      default: openobserve
      required: true
      label:
        en: Existing database name
        es-es: Existing database name
        ja: Existing database name
        ms: Existing database name
        pt-br: Existing database name
        ru: Existing database name
        ko: Existing database name
        zh-Hant: 現有資料庫名稱
        zh: 已有数据库名
        tr: Existing database name
      rule: paramCommon
