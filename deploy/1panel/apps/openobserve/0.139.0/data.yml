      type: text
      default: openobserve
      required: true
      label:
        en: Database user
        es-es: Database user
        ja: Database user
        ms: Database user
        pt-br: Database user
        ru: Database user
        ko: Database user
        zh-Hant: 資料庫使用者
        zh: 数据库用户
        tr: Database user
      rule: paramCommon
