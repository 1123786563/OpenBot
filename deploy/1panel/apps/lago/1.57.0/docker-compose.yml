  front:
    command: null
    container_name: ${CONTAINER_NAME}
    depends_on:
      api:
        condition: service_healthy
        restart: true
        required: true
    entrypoint: null
    environment:
      API_URL: ${LAGO_API_URL:-http://localhost:13000}
      APP_ENV: production
      LAGO_API_URL: ${LAGO_API_URL:-http://localhost:13000}
      LAGO_DISABLE_PDF_GENERATION: "false"
      LAGO_FRONT_URL: ${LAGO_FRONT_URL:-http://localhost:13001}
      LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
    image: getlago/front:v1.57.0
    networks:
      default: null
      1panel-network:
        aliases:
          - openbot-lago
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp
    ports:
      - 127.0.0.1:${PANEL_APP_PORT_HTTP:-13001}:8080
    labels:
      createdBy: Apps
