networks:
  client:
    name: openbot-lago
    ipam: {}
    internal: true
  default:
    ipam: {}
  1panel-network:
    external: true
services:
  secrets-init:
    image: getlago/api:v1.57.0
    container_name: ${CONTAINER_NAME}-secrets-init
    user: "0:0"
    network_mode: none
    entrypoint: [ruby, /lago-secrets.rb]
    command: [--init]
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      LAGO_RSA_PRIVATE_KEY: ${LAGO_RSA_PRIVATE_KEY:-}
      LAGO_ENCRYPTION_PRIMARY_KEY: ${LAGO_ENCRYPTION_PRIMARY_KEY:-}
      LAGO_ENCRYPTION_DETERMINISTIC_KEY: ${LAGO_ENCRYPTION_DETERMINISTIC_KEY:-}
      LAGO_ENCRYPTION_KEY_DERIVATION_SALT: ${LAGO_ENCRYPTION_KEY_DERIVATION_SALT:-}
    volumes:
      - ./secrets.rb:/lago-secrets.rb:ro
      - lago_secrets:/lago-secrets
    labels:
      createdBy: Apps
      skipStatusCheck: "true"
  api:
    command:
      - ./scripts/start.api.sh
    container_name: ${CONTAINER_NAME}-api
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
        required: true
        restart: true
    entrypoint: [ruby, /lago-secrets.rb]
    environment:
      PGHOST: ${PANEL_DB_HOST:?Select a database instance}
      PGPORT: ${PANEL_DB_PORT:?Missing database instance port}
      PGDATABASE: ${PANEL_DB_NAME:?Enter the database name}
      PGUSER: ${PANEL_DB_USER:?Enter the database user}
      PGPASSWORD: ${PANEL_DB_USER_PASSWORD:?Enter the database password}
      PGSSLMODE: ${DB_SSL_MODE:-disable}
      GOOGLE_AUTH_CLIENT_ID: ""
      GOOGLE_AUTH_CLIENT_SECRET: ""
      LAGO_API_URL: ${LAGO_API_URL:-http://localhost:13000}
      LAGO_AWS_S3_ACCESS_KEY_ID: azerty123456
      LAGO_AWS_S3_BUCKET: bucket
      LAGO_AWS_S3_ENDPOINT: ""
      LAGO_AWS_S3_REGION: us-east-1
      LAGO_AWS_S3_SECRET_ACCESS_KEY: azerty123456
      LAGO_CREATE_ORG: "false"
      LAGO_DATA_API_BEARER_TOKEN: ""
      LAGO_DATA_API_URL: http://data-api
      LAGO_DISABLE_PDF_GENERATION: "false"
      LAGO_DISABLE_SEGMENT: "true"
      LAGO_DISABLE_SIGNUP: "true"
      LAGO_DISABLE_WALLET_REFRESH: ""
      LAGO_FROM_EMAIL: ""
      LAGO_FRONT_URL: ${LAGO_FRONT_URL:-http://localhost:13001}
      LAGO_GCS_BUCKET: ""
      LAGO_GCS_PROJECT: ""
      LAGO_LICENSE: ""
      LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
      LAGO_ORG_API_KEY: ""
      LAGO_ORG_NAME: ""
      LAGO_ORG_USER_EMAIL: ""
      LAGO_ORG_USER_PASSWORD: ""
      LAGO_PDF_URL: http://pdf:3000
      LAGO_REDIS_CABLE_URL: ""
      LAGO_REDIS_CACHE_MASTER_NAME: master
      LAGO_REDIS_CACHE_PASSWORD: ${PANEL_REDIS_ROOT_PASSWORD}
      LAGO_REDIS_CACHE_SENTINELS: ""
      LAGO_REDIS_CACHE_SENTINEL_PASSWORD: ""
      LAGO_REDIS_CACHE_SENTINEL_USERNAME: ""
      LAGO_REDIS_CACHE_URL: redis://${PANEL_REDIS_HOST:?Select a Redis instance}:${PANEL_REDIS_PORT:-6379}
      LAGO_REDIS_SIDEKIQ_MASTER_NAME: master
      LAGO_REDIS_SIDEKIQ_SENTINELS: ""
      LAGO_REDIS_SIDEKIQ_SENTINEL_PASSWORD: ""
      LAGO_REDIS_SIDEKIQ_SENTINEL_USERNAME: ""
      LAGO_SIDEKIQ_WEB: "true"
      LAGO_SMTP_ADDRESS: ""
      LAGO_SMTP_PASSWORD: ""
      LAGO_SMTP_PORT: "587"
      LAGO_SMTP_USERNAME: ""
      LAGO_USE_AWS_S3: "false"
      LAGO_USE_GCS: "false"
      LAGO_WEBHOOK_ALLOW_PRIVATE_URLS: "false"
      MISTRAL_AGENT_ID: ""
      MISTRAL_API_KEY: ""
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      REDIS_PASSWORD: ${PANEL_REDIS_ROOT_PASSWORD}
      REDIS_URL: redis://${PANEL_REDIS_HOST:?Select a Redis instance}:${PANEL_REDIS_PORT:-6379}
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:3000/health || exit 1
      timeout: 1m0s
      interval: 10s
      start_period: 30s
      start_interval: 2s
    image: getlago/api:v1.57.0
    networks:
      client:
        aliases:
          - lago-api
      default: {}
      1panel-network: {}
    restart: unless-stopped
    volumes:
      - ./secrets.rb:/lago-secrets.rb:ro
      - lago_secrets:/lago-secrets:ro
      - lago_storage_data:/app/storage
    ports:
      - 127.0.0.1:${PANEL_APP_PORT_API:-13000}:3000
    labels:
      createdBy: Apps
  api-clock:
