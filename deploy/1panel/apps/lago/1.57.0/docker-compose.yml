      LAGO_DISABLE_SEGMENT: "true"
      LAGO_DISABLE_SIGNUP: "false"
      LAGO_DISABLE_WALLET_REFRESH: ""
      LAGO_FROM_EMAIL: ""
      LAGO_GCS_BUCKET: ""
      LAGO_GCS_PROJECT: ""
      LAGO_LICENSE: ""
