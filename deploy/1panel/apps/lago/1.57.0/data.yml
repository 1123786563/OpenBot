additionalProperties:
  formFields:
    - envKey: PANEL_APP_PORT_HTTP
      type: number
      default: 13001
      required: true
      rule: paramPort
      label:
        en: HTTP port
        es-es: HTTP port
        ja: HTTP port
        ms: HTTP port
        pt-br: HTTP port
        ru: HTTP port
        ko: HTTP port
