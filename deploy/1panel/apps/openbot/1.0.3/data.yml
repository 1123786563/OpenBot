        ja: Database password (URL-encode special characters)
        ms: Database password (URL-encode special characters)
        pt-br: Database password (URL-encode special characters)
        ru: Database password (URL-encode special characters)
        ko: Database password (URL-encode special characters)
        zh-Hant: 資料庫密碼（特殊字元需 URL 編碼）
        zh: 数据库密码（特殊字符需 URL 编码）
        tr: Database password (URL-encode special characters)
    - envKey: DB_SSL_MODE
      type: select
      default: disable
      required: true
      label:
        en: PostgreSQL TLS mode
        es-es: PostgreSQL TLS mode
        ja: PostgreSQL TLS mode
        ms: PostgreSQL TLS mode
        pt-br: PostgreSQL TLS mode
        ru: PostgreSQL TLS mode
        ko: PostgreSQL TLS mode
        zh-Hant: PostgreSQL TLS 模式
        zh: PostgreSQL TLS 模式
        tr: PostgreSQL TLS mode
      values:
        - label: disable
          value: disable
        - label: require
          value: require
        - label: verify-full
          value: verify-full
