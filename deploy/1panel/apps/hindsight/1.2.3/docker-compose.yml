networks:
  1panel-network:
    external: true
  client:
    external: true
    name: openbot-hindsight
services:
  hindsight:
    command: null
    entrypoint: null
    environment:
      HF_HOME: /home/hindsight/.cache/huggingface
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION: "false"
      HINDSIGHT_API_ENABLE_BANK_CONFIG_API: "false"
      HINDSIGHT_API_LLM_PROVIDER: none
      HINDSIGHT_API_RERANKER_PROVIDER: local
      HINDSIGHT_API_DATABASE_URL: postgresql://${PANEL_DB_USER:?Enter the database user}:${DB_URI_PASSWORD:-${PANEL_DB_USER_PASSWORD:?Enter the database password}}@${PANEL_DB_HOST:?Select a database instance}:${PANEL_DB_PORT:?Missing database instance port}/${PANEL_DB_NAME:?Enter the database name}?sslmode=${DB_SSL_MODE:-disable}
    image: ghcr.io/vectorize-io/hindsight:1.2.3
    networks:
      client: {}
      1panel-network: {}
    restart: unless-stopped
    shm_size: "1073741824"
    stop_grace_period: 1m15s
    volumes:
      - model-cache:/home/hindsight/.cache
    ports:
      - 127.0.0.1:${PANEL_APP_PORT_HTTP:-18888}:8888
      - 127.0.0.1:${PANEL_APP_PORT_CP:-19999}:9999
    container_name: ${CONTAINER_NAME}
    labels:
      createdBy: Apps
volumes:
  model-cache: {}
