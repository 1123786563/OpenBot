additionalProperties:
  formFields:
    - envKey: PANEL_APP_PORT_HTTP
      type: number
      default: 19999
      required: true
      edit: true
      rule: paramPort
      label:
        en: Console (UI) port (Required)
        es-es: Console (UI) port (Obligatorio)
        ja: Console (UI) port (必須)
        ms: Console (UI) port (Wajib)
        pt-br: Console (UI) port (Obrigatório)
        ru: Console (UI) port (Обязательно)
        ko: Console (UI) port (필수)
        zh-Hant: 控制台（UI）埠（必填）
        zh: 控制台（UI）端口（必填）
        tr: Console (UI) port (Zorunlu)
    - envKey: PANEL_APP_PORT_API
      type: number
      default: 18888
      required: true
      edit: true
      rule: paramPort
      label:
        en: API port (Required)
        es-es: API port (Obligatorio)
        ja: API port (必須)
        ms: API port (Wajib)
        pt-br: API port (Obrigatório)
        ru: API port (Обязательно)
        ko: API port (필수)
        zh-Hant: API 埠（必填）
        zh: API 端口（必填）
        tr: API port (Zorunlu)
    - envKey: HINDSIGHT_CP_ACCESS_KEY
      type: password
      default: ""
      random: true
      required: true
      edit: true
      label:
        en: Console access key (Required)
        es-es: Console access key (Obligatorio)
        ja: Console access key (必須)
        ms: Console access key (Wajib)
        pt-br: Console access key (Obrigatório)
        ru: Console access key (Обязательно)
        ko: Console access key (필수)
        zh-Hant: 控制台存取金鑰（必填）
        zh: 控制台访问密钥（必填）
        tr: Console access key (Zorunlu)
    - envKey: HINDSIGHT_API_TENANT_API_KEY
      type: password
      default: ""
      random: true
      required: true
      edit: true
      label:
        en: Hindsight API key (Required, callers send it as a bearer token)
        zh: Hindsight API 密钥（必填，调用方以 Bearer 令牌携带）
        zh-Hant: Hindsight API 金鑰（必填，呼叫方以 Bearer 權杖攜帶）
    - envKey: PANEL_DB_HOST
      type: text
      default: postgres
      required: true
      edit: true
      label:
        en: PostgreSQL host. `postgres` is the database this app runs for itself; name a 1Panel instance only if it provides a pgvector that runs on this CPU
        zh: PostgreSQL 主机。`postgres` 是本应用自带的数据库；只有当 1Panel 数据库实例的 pgvector 能在本机 CPU 上运行时才填它
        zh-Hant: PostgreSQL 主機。`postgres` 是本應用自帶的資料庫；只有當 1Panel 資料庫實例的 pgvector 能在本機 CPU 上執行時才填它
    - envKey: PANEL_DB_PORT
      type: number
      default: 5432
      required: true
      edit: true
      rule: paramPort
      label:
        en: PostgreSQL port (Required)
        zh: PostgreSQL 端口（必填）
        zh-Hant: PostgreSQL 連接埠（必填）
    - envKey: PANEL_DB_NAME
      type: text
      default: hindsight
      random: true
      required: true
      label:
        en: Database name (Required)
        es-es: Database name (Obligatorio)
        ja: Database name (必須)
        ms: Database name (Wajib)
        pt-br: Database name (Obrigatório)
        ru: Database name (Обязательно)
        ko: Database name (필수)
        zh-Hant: 資料庫名稱（必填）
        zh: 数据库名（必填）
        tr: Database name (Zorunlu)
      rule: paramCommon
    - envKey: PANEL_DB_USER
      type: text
      default: hindsight
      random: true
      required: true
      label:
        en: Database user (Required)
        es-es: Database user (Obligatorio)
        ja: Database user (必須)
        ms: Database user (Wajib)
        pt-br: Database user (Obrigatório)
        ru: Database user (Обязательно)
        ko: Database user (필수)
        zh-Hant: 資料庫使用者（必填）
        zh: 数据库用户（必填）
        tr: Database user (Zorunlu)
      rule: paramCommon
    - envKey: PANEL_DB_USER_PASSWORD
      type: password
      default: Hindsight
      random: true
      required: true
      label:
        en: Database password (Required)
        es-es: Database password (Obligatorio)
        ja: Database password (必須)
        ms: Database password (Wajib)
        pt-br: Database password (Obrigatório)
        ru: Database password (Обязательно)
        ko: Database password (필수)
        zh-Hant: 資料庫密碼（必填）
        zh: 数据库密码（必填）
        tr: Database password (Zorunlu)
    - envKey: DB_URI_PASSWORD
      type: password
      default: ""
      required: false
      label:
        en: URL-encoded database password (if needed)
        es-es: URL-encoded database password (if needed)
        ja: URL-encoded database password (if needed)
        ms: URL-encoded database password (if needed)
        pt-br: URL-encoded database password (if needed)
        ru: URL-encoded database password (if needed)
        ko: URL-encoded database password (if needed)
        zh-Hant: URL 編碼後的資料庫密碼（含特殊字元時填寫）
        zh: URL 编码后的数据库密码（含特殊字符时填写）
        tr: URL-encoded database password (if needed)
    - envKey: DB_SSL_MODE
      type: select
      default: disable
      required: true
      label:
        en: PostgreSQL TLS mode (Required)
        es-es: PostgreSQL TLS mode (Obligatorio)
        ja: PostgreSQL TLS mode (必須)
        ms: PostgreSQL TLS mode (Wajib)
        pt-br: PostgreSQL TLS mode (Obrigatório)
        ru: PostgreSQL TLS mode (Обязательно)
        ko: PostgreSQL TLS mode (필수)
        zh-Hant: PostgreSQL TLS 模式（必填）
        zh: PostgreSQL TLS 模式（必填）
        tr: PostgreSQL TLS mode (Zorunlu)
      values:
        - label: disable
          value: disable
        - label: require
          value: require
        - label: verify-full
          value: verify-full
