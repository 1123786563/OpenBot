networks:
  1panel-network:
    external: true
  client:
    external: true
    name: openbot-hindsight
  db:
    internal: true
services:
  # The 1Panel PostgreSQL cluster image ships a pgvector built for AVX-512, and this host's CPU has
  # none, so a vector write there kills the backend and every connection on the cluster. Hindsight
  # keeps its own database on the official pgvector image, which picks its code path at run time.
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PANEL_DB_USER:?Enter the database user}
      POSTGRES_PASSWORD: ${PANEL_DB_USER_PASSWORD:?Enter the database password}
      POSTGRES_DB: ${PANEL_DB_NAME:?Enter the database name}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PANEL_DB_USER}", "-d", "${PANEL_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - db
  hindsight:
    command: null
    entrypoint: null
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HF_HOME: /home/hindsight/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION: "false"
      HINDSIGHT_API_ENABLE_BANK_CONFIG_API: "false"
      HINDSIGHT_API_LLM_PROVIDER: none
      HINDSIGHT_API_RERANKER_PROVIDER: local
      HINDSIGHT_CP_ACCESS_KEY: ${HINDSIGHT_CP_ACCESS_KEY:?Enter the console access key}
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_TENANT_API_KEY:?Enter the Hindsight API key}
      HINDSIGHT_API_TENANT_EXTENSION: 'hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension'
      HINDSIGHT_CP_DATAPLANE_API_KEY: ${HINDSIGHT_API_TENANT_API_KEY}
      HINDSIGHT_API_DATABASE_URL: postgresql://${PANEL_DB_USER:?Enter the database user}:${DB_URI_PASSWORD:-${PANEL_DB_USER_PASSWORD:?Enter the database password}}@${PANEL_DB_HOST:?Select a database instance}:${PANEL_DB_PORT:?Missing database instance port}/${PANEL_DB_NAME:?Enter the database name}?sslmode=${DB_SSL_MODE:-disable}
    image: ghcr.io/vectorize-io/hindsight:1.3.0
    networks:
      client: {}
      1panel-network: {}
      db: {}
    restart: unless-stopped
    shm_size: "1073741824"
    stop_grace_period: 1m15s
    volumes:
      - model-cache:/home/hindsight/.cache
    ports:
      - 127.0.0.1:${PANEL_APP_PORT_HTTP:-19999}:9999
      - 127.0.0.1:${PANEL_APP_PORT_API:-18888}:8888
    container_name: ${CONTAINER_NAME}
    labels:
      createdBy: Apps
volumes:
  model-cache: {}
  postgres-data: {}
