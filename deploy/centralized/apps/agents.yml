name: openbot-central-agents
services:
  agent-bot:
    build:
      context: ${OPENBOT_AGENT_SOURCE:?Run deploy/deploy.sh init}
      dockerfile: agent-bot/Dockerfile
    image: ${BOT_IMAGE:-openbot-agent-bot:latest}
    pull_policy: never
    ports: []
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      OPENAI_BASE_URL: ${OPENAI_CONTAINER_BASE_URL:-${OPENAI_BASE_URL:-}}
      BOT_MODEL: ${AGENT_BOT_MODEL:-gpt-5.5}
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e "await fetch('http://localhost:4200/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agents
  agent-langgraph:
    build:
      context: ${OPENBOT_AGENT_SOURCE:?Run deploy/deploy.sh init}
      dockerfile: agent-langgraph/Dockerfile
    image: ${LANGGRAPH_IMAGE:-openbot-agent-langgraph:latest}
    pull_policy: never
    ports: []
    environment:
      BOT_PROVIDER: ${BOT_PROVIDER:-openai}
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_CONTAINER_BASE_URL:-${OPENAI_BASE_URL:-}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENERATIVE_AI_BASE_URL: ${GOOGLE_GENERATIVE_AI_BASE_URL:-}
      BOT_MODEL: ${BOT_MODEL:-}
      BOT_RESPONSES_API: ${BOT_RESPONSES_API:-false}
      BOT_REASONING_EFFORT: ${BOT_REASONING_EFFORT:-}
      OPENBOT_TOOL_URL: ${OPENBOT_TOOL_URL:-http://host.docker.internal:3001/api/agent-tools/call}
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:-}
    extra_hosts:
      - host.docker.internal:${OPENBOT_HOST_GATEWAY:-host-gateway}
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e "await fetch('http://localhost:4201/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agents
  agent-computer:
    build:
      context: ${OPENBOT_AGENT_SOURCE:?Run deploy/deploy.sh init}
      dockerfile: agent-computer/Dockerfile
    image: ${COMPUTER_IMAGE:-openbot-agent-computer:latest}
    pull_policy: never
    cap_add:
      - NET_RAW
    ports: []
    environment:
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-openbot-dev-computer-token}
      COMPUTER_BROWSER_MODE: ${COMPUTER_BROWSER_MODE:-headed}
      COMPUTER_MAX_BROWSERS: ${COMPUTER_MAX_BROWSERS:-}
      COMPUTER_BROWSER_IDLE_MS: ${COMPUTER_BROWSER_IDLE_MS:-}
      COMPUTER_MEMORY_HIGH_PERCENT: ${COMPUTER_MEMORY_HIGH_PERCENT:-}
      COMPUTER_TAB_IDLE_MS: ${COMPUTER_TAB_IDLE_MS:-}
      COMPUTER_SEPARATE_WORKSPACES: on
      COMPUTER_PERSON_ID: ${COMPUTER_PERSON_ID:-}
      OPENBOT_EDITION: ${OPENBOT_EDITION:-}
      COMPUTER_LOOPBACK_RELAYS: ${COMPUTER_LOOPBACK_RELAYS:-}
    extra_hosts:
      - host.docker.internal:${OPENBOT_HOST_GATEWAY:-host-gateway}
    volumes:
      - agent-workspace:/workspace
      - agent-profiles:/profiles
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e "await fetch('http://localhost:4100/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agents
  supervisor:
    build:
      context: ${OPENBOT_AGENT_SOURCE:?Run deploy/deploy.sh init}
      dockerfile: supervisor/Dockerfile
    image: ${SUPERVISOR_IMAGE:-openbot-supervisor:latest}
    pull_policy: never
    environment:
      PORT: "4300"
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:-openbot-dev-supervisor-token}
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-openbot-dev-computer-token}
      COMPUTER_BROWSER_MODE: ${COMPUTER_BROWSER_MODE:-headed}
      COMPUTER_IMAGE: ${COMPUTER_IMAGE:-openbot-agent-computer:latest}
      COMPUTER_NAMESPACE: openbot-central
      COMPUTER_NETWORK: openbot-central-agents
      COMPUTER_RUNTIME: ${COMPUTER_RUNTIME:-}
      SPIRE_SOCKET: /tmp/spire-server/private/api.sock
      SPIRE_TRUST_DOMAIN: openbot.local
      SPIRE_AGENT_ID: spiffe://openbot.local/spire/agent/join_token/${SPIRE_JOIN_TOKEN}
      SPIRE_AGENT_SOCKET_VOLUME: openbot-central-spire-agent-socket
    ports: []
    volumes:
      - ${ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - spire-server-socket:/tmp/spire-server/private:ro
    security_opt:
      - label=disable
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e "await fetch('http://localhost:4300/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agents
networks:
  agents:
    name: openbot-central-agents
volumes:
  agent-workspace: {}
  agent-profiles: {}
  spire-server-socket:
    external: true
    name: openbot-central-spire-server-socket
