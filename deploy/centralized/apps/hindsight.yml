name: openbot-central-hindsight
services:
  hindsight:
    command: null
    entrypoint: null
    environment:
      HF_HOME: /home/hindsight/.cache/huggingface
      HF_HUB_OFFLINE: ${HINDSIGHT_HF_HUB_OFFLINE:-0}
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION: "false"
      HINDSIGHT_API_ENABLE_BANK_CONFIG_API: "false"
      HINDSIGHT_API_LLM_PROVIDER: none
      HINDSIGHT_API_RERANKER_PROVIDER: local
      HINDSIGHT_CP_ACCESS_KEY: ${HINDSIGHT_CP_ACCESS_KEY:?Enter the console access key}
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_TENANT_API_KEY:?Enter the Hindsight API key}
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_CP_DATAPLANE_API_KEY: ${HINDSIGHT_API_TENANT_API_KEY}
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${HINDSIGHT_DB_PASSWORD:?Set
        HINDSIGHT_DB_PASSWORD}@postgres:5432/hindsight?sslmode=disable
    image: ghcr.io/vectorize-io/hindsight:1.3.0
    networks:
      - middleware
      - client
    restart: unless-stopped
    shm_size: "1073741824"
    stop_grace_period: 1m15s
    volumes:
      - model-cache:/home/hindsight/.cache
    ports:
      - 127.0.0.1:${HINDSIGHT_PORT:-18888}:8888
      - 127.0.0.1:${HINDSIGHT_CONSOLE_PORT:-19999}:9999
networks:
  middleware:
    external: true
    name: ${CENTRAL_NETWORK:-openbot-central}
  client:
    name: openbot-hindsight
volumes:
  model-cache: {}
