name: openbot-central-flexprice
services:
  flexprice-api:
    image: ${FLEXPRICE_IMAGE:?Set FLEXPRICE_IMAGE}
    restart: unless-stopped
    env_file: &a1
      - path: ${FLEXPRICE_ENV_FILE:-.env.flexprice}
    networks: &a2
      - middleware
    environment:
      FLEXPRICE_ACTIVITY_ENABLED: "true"
      FLEXPRICE_POSTGRES_HOST: postgres
      FLEXPRICE_POSTGRES_READER_HOST: postgres
      FLEXPRICE_POSTGRES_PORT: "5432"
      FLEXPRICE_POSTGRES_USER: flexprice
      FLEXPRICE_POSTGRES_PASSWORD: ${FLEXPRICE_DB_PASSWORD:?Set FLEXPRICE_DB_PASSWORD}
      FLEXPRICE_POSTGRES_DBNAME: flexprice
      FLEXPRICE_POSTGRES_SSLMODE: disable
      FLEXPRICE_KAFKA_BROKERS: kafka:9092
      FLEXPRICE_CLICKHOUSE_ADDRESS: flexprice-clickhouse:9000
      FLEXPRICE_CLICKHOUSE_USERNAME: flexprice
      FLEXPRICE_CLICKHOUSE_PASSWORD: ${FLEXPRICE_CLICKHOUSE_PASSWORD:?Set FLEXPRICE_CLICKHOUSE_PASSWORD}
      FLEXPRICE_CLICKHOUSE_DATABASE: flexprice
      FLEXPRICE_TEMPORAL_ADDRESS: temporal:7233
      FLEXPRICE_TEMPORAL_NAMESPACE: flexprice
      FLEXPRICE_REDIS_CLUSTER_MODE: "false"
      FLEXPRICE_REDIS_DB: "3"
      FLEXPRICE_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      FLEXPRICE_REDIS_SENTINEL_MASTER_NAME: openbot-redis
      FLEXPRICE_REDIS_SENTINEL_ADDRS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      FLEXPRICE_REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:?Set REDIS_SENTINEL_PASSWORD}
      FLEXPRICE_REDIS_ROUTE_READS_TO_REPLICAS: "false"
      FLEXPRICE_REDIS_KEY_PREFIX: flexprice:central
      FLEXPRICE_CACHE_ENABLED: "true"
      FLEXPRICE_CACHE_REDIS_ENABLED: "true"
      FLEXPRICE_DEPLOYMENT_MODE: api
    ports:
      - 127.0.0.1:${FLEXPRICE_PORT:-18083}:8080
  flexprice-consumer:
    image: ${FLEXPRICE_IMAGE:?Set FLEXPRICE_IMAGE}
    restart: unless-stopped
    env_file: *a1
    networks: *a2
    environment:
      FLEXPRICE_ACTIVITY_ENABLED: "true"
      FLEXPRICE_POSTGRES_HOST: postgres
      FLEXPRICE_POSTGRES_READER_HOST: postgres
      FLEXPRICE_POSTGRES_PORT: "5432"
      FLEXPRICE_POSTGRES_USER: flexprice
      FLEXPRICE_POSTGRES_PASSWORD: ${FLEXPRICE_DB_PASSWORD:?Set FLEXPRICE_DB_PASSWORD}
      FLEXPRICE_POSTGRES_DBNAME: flexprice
      FLEXPRICE_POSTGRES_SSLMODE: disable
      FLEXPRICE_KAFKA_BROKERS: kafka:9092
      FLEXPRICE_CLICKHOUSE_ADDRESS: flexprice-clickhouse:9000
      FLEXPRICE_CLICKHOUSE_USERNAME: flexprice
      FLEXPRICE_CLICKHOUSE_PASSWORD: ${FLEXPRICE_CLICKHOUSE_PASSWORD:?Set FLEXPRICE_CLICKHOUSE_PASSWORD}
      FLEXPRICE_CLICKHOUSE_DATABASE: flexprice
      FLEXPRICE_TEMPORAL_ADDRESS: temporal:7233
      FLEXPRICE_TEMPORAL_NAMESPACE: flexprice
      FLEXPRICE_REDIS_CLUSTER_MODE: "false"
      FLEXPRICE_REDIS_DB: "3"
      FLEXPRICE_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      FLEXPRICE_REDIS_SENTINEL_MASTER_NAME: openbot-redis
      FLEXPRICE_REDIS_SENTINEL_ADDRS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      FLEXPRICE_REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:?Set REDIS_SENTINEL_PASSWORD}
      FLEXPRICE_REDIS_ROUTE_READS_TO_REPLICAS: "false"
      FLEXPRICE_REDIS_KEY_PREFIX: flexprice:central
      FLEXPRICE_CACHE_ENABLED: "true"
      FLEXPRICE_CACHE_REDIS_ENABLED: "true"
      FLEXPRICE_DEPLOYMENT_MODE: consumer
  flexprice-worker:
    image: ${FLEXPRICE_IMAGE:?Set FLEXPRICE_IMAGE}
    restart: unless-stopped
    env_file: *a1
    networks: *a2
    environment:
      FLEXPRICE_ACTIVITY_ENABLED: "true"
      FLEXPRICE_POSTGRES_HOST: postgres
      FLEXPRICE_POSTGRES_READER_HOST: postgres
      FLEXPRICE_POSTGRES_PORT: "5432"
      FLEXPRICE_POSTGRES_USER: flexprice
      FLEXPRICE_POSTGRES_PASSWORD: ${FLEXPRICE_DB_PASSWORD:?Set FLEXPRICE_DB_PASSWORD}
      FLEXPRICE_POSTGRES_DBNAME: flexprice
      FLEXPRICE_POSTGRES_SSLMODE: disable
      FLEXPRICE_KAFKA_BROKERS: kafka:9092
      FLEXPRICE_CLICKHOUSE_ADDRESS: flexprice-clickhouse:9000
      FLEXPRICE_CLICKHOUSE_USERNAME: flexprice
      FLEXPRICE_CLICKHOUSE_PASSWORD: ${FLEXPRICE_CLICKHOUSE_PASSWORD:?Set FLEXPRICE_CLICKHOUSE_PASSWORD}
      FLEXPRICE_CLICKHOUSE_DATABASE: flexprice
      FLEXPRICE_TEMPORAL_ADDRESS: temporal:7233
      FLEXPRICE_TEMPORAL_NAMESPACE: flexprice
      FLEXPRICE_REDIS_CLUSTER_MODE: "false"
      FLEXPRICE_REDIS_DB: "3"
      FLEXPRICE_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      FLEXPRICE_REDIS_SENTINEL_MASTER_NAME: openbot-redis
      FLEXPRICE_REDIS_SENTINEL_ADDRS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      FLEXPRICE_REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:?Set REDIS_SENTINEL_PASSWORD}
      FLEXPRICE_REDIS_ROUTE_READS_TO_REPLICAS: "false"
      FLEXPRICE_REDIS_KEY_PREFIX: flexprice:central
      FLEXPRICE_CACHE_ENABLED: "true"
      FLEXPRICE_CACHE_REDIS_ENABLED: "true"
      FLEXPRICE_DEPLOYMENT_MODE: temporal_worker
networks:
  middleware:
    external: true
    name: ${CENTRAL_NETWORK:-openbot-central}
