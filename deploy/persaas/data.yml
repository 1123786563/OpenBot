name: persaas-data
services:
  temporal:
    image: temporalio/auto-setup:1.26.2
    restart: unless-stopped
    mem_limit: 1g
    env_file: runtime/temporal.env
    networks: [panel]
    logging: &logs
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  flexprice:
    image: flexprice:2.1.52-persaas
    restart: unless-stopped
    mem_limit: 1536m
    env_file: runtime/flexprice.env
    environment:
      FLEXPRICE_DEPLOYMENT_MODE: local
      GOMEMLIMIT: 1GiB
    ports: ["127.0.0.1:18083:8080"]
    networks: [panel]
    depends_on:
      temporal: {condition: service_started}
    logging: *logs
  flexprice-ui:
    image: nginx:1.28-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports: ["127.0.0.1:18085:8080"]
    volumes:
      - ./flexprice-ui-dist:/usr/share/nginx/html:ro
      - ./extensions/flexprice-ui.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [panel]
    depends_on:
      flexprice: {condition: service_started}
    logging: *logs
  flexprice-migrate:
    image: flexprice:2.1.52-persaas
    profiles: [tools]
    env_file: runtime/flexprice.env
    networks: [panel]
    restart: "no"
  sync-flexprice:
    image: openbot-server:persaas-cbcdbc175
    profiles: [tools]
    user: "0:0"
    entrypoint: [bun, /app/infisical-runtime.mjs]
    command: [--export, /runtime-config/flexprice.env]
    env_file: infisical-flexprice.env
    volumes:
      - ./infisical-runtime.mjs:/app/infisical-runtime.mjs:ro
      - ./runtime:/runtime-config
    networks: [panel]
    restart: "no"
  sync-temporal:
    image: openbot-server:persaas-cbcdbc175
    profiles: [tools]
    user: "0:0"
    entrypoint: [bun, /app/infisical-runtime.mjs]
    command: [--export, /runtime-config/temporal.env]
    env_file: infisical-temporal.env
    volumes:
      - ./infisical-runtime.mjs:/app/infisical-runtime.mjs:ro
      - ./runtime:/runtime-config
    networks: [panel]
    restart: "no"
networks:
  panel:
    external: true
    name: 1panel-network
