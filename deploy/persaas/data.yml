name: persaas-data
services:
  temporal:
    image: temporalio/auto-setup:1.26.2
    restart: unless-stopped
    mem_limit: 1g
    env_file: temporal.env
    networks: [panel]
    logging: &logs
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  flexprice:
    image: flexprice:2.1.52-persaas
    restart: unless-stopped
    mem_limit: 1536m
    env_file: flexprice.env
    environment:
      FLEXPRICE_DEPLOYMENT_MODE: local
      GOMEMLIMIT: 1GiB
    ports: ["127.0.0.1:18083:8080"]
    networks: [panel]
    depends_on:
      temporal: {condition: service_started}
    logging: *logs
  flexprice-migrate:
    image: flexprice:2.1.52-persaas
    profiles: [tools]
    env_file: flexprice.env
    networks: [panel]
    restart: "no"
networks:
  panel:
    external: true
    name: 1panel-network
