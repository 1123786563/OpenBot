            LAGO_REDIS_CACHE_SENTINELS: ""
            LAGO_REDIS_CACHE_URL: redis://persaas-redis:6379/7
            LAGO_REDIS_SIDEKIQ_MASTER_NAME: master
            LAGO_REDIS_SIDEKIQ_SENTINEL_PASSWORD: ""
            LAGO_REDIS_SIDEKIQ_SENTINEL_USERNAME: ""
            LAGO_REDIS_SIDEKIQ_SENTINELS: ""
            LAGO_SIDEKIQ_WEB: "true"
            LAGO_SMTP_ADDRESS: ""
            LAGO_SMTP_PASSWORD: ""
            LAGO_SMTP_PORT: "587"
            LAGO_SMTP_USERNAME: ""
            LAGO_USE_AWS_S3: "true"
            LAGO_USE_GCS: "false"
            LAGO_WEBHOOK_ALLOW_PRIVATE_URLS: "false"
            MISTRAL_AGENT_ID: ""
            MISTRAL_API_KEY: ""
            PGDATABASE: ${PANEL_DB_NAME:?Enter the database name}
            PGHOST: lago-postgres
            PGPASSWORD: ${PANEL_DB_USER_PASSWORD:?Enter the database password}
            PGPORT: ${PANEL_DB_PORT:?Missing database instance port}
            PGSSLMODE: ${DB_SSL_MODE:-disable}
            PGUSER: ${PANEL_DB_USER:?Enter the database user}
            RAILS_ENV: production
            RAILS_LOG_TO_STDOUT: "true"
            REDIS_PASSWORD: ${PANEL_REDIS_ROOT_PASSWORD}
            REDIS_URL: redis://persaas-redis:6379/6
        healthcheck:
            interval: 10s
            start_interval: 2s
            start_period: 30s
            test:
                - CMD-SHELL
                - curl -f http://localhost:8080 || exit 1
            timeout: 1m0s
        image: getlago/api:v1.57.0
        labels:
            createdBy: Apps
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        mem_limit: 1024m
        networks:
            1panel-network: {}
            default: null
        restart: unless-stopped
        volumes:
            - ./secrets.rb:/lago-secrets.rb:ro
            - lago_secrets:/lago-secrets:ro
            - lago_storage_data:/app/storage
    front:
        command: null
        container_name: ${CONTAINER_NAME}
        depends_on:
            api:
                condition: service_healthy
                required: true
                restart: true
        entrypoint: null
        environment:
            API_URL: ${LAGO_API_URL:-http://localhost:13000}
            APP_ENV: production
            LAGO_API_URL: ${LAGO_API_URL:-http://localhost:13000}
            LAGO_DISABLE_PDF_GENERATION: "false"
            LAGO_FRONT_URL: ${LAGO_FRONT_URL:-http://localhost:13001}
            LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
        image: getlago/front:v1.57.0
        labels:
            createdBy: Apps
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        mem_limit: 128m
        networks:
            1panel-network:
                aliases:
                    - openbot-lago
            default: null
        ports:
            - 127.0.0.1:${PANEL_APP_PORT_HTTP:-13001}:8080
        read_only: true
        restart: unless-stopped
        tmpfs:
            - /tmp
    lago-postgres:
        container_name: persaas-lago-postgres
        environment:
            POSTGRES_DB: lago
            POSTGRES_PASSWORD: ${PANEL_DB_USER_PASSWORD}
            POSTGRES_USER: lago
        healthcheck:
            interval: 5s
            retries: 30
            test:
                - CMD-SHELL
                - pg_isready -U lago -d lago
            timeout: 3s
        image: getlago/postgres-partman:15.0-alpine
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        mem_limit: 768m
        networks:
            - default
        restart: unless-stopped
        volumes:
            - lago_postgres:/var/lib/postgresql/data
    migrate:
        command:
            - ./scripts/migrate.sh
        container_name: ${CONTAINER_NAME}-migrate
        depends_on:
            lago-postgres:
                condition: service_healthy
            secrets-init:
                condition: service_completed_successfully
        entrypoint:
            - ruby
            - /lago-secrets.rb
        environment:
            GOOGLE_AUTH_CLIENT_ID: ""
            GOOGLE_AUTH_CLIENT_SECRET: ""
            LAGO_AWS_S3_ACCESS_KEY_ID: ${LAGO_S3_ACCESS_KEY}
            LAGO_AWS_S3_BUCKET: lago
            LAGO_AWS_S3_ENDPOINT: https://lago-api.persaas.cn
            LAGO_AWS_S3_REGION: us-east-1
            LAGO_AWS_S3_SECRET_ACCESS_KEY: ${LAGO_S3_SECRET_KEY}
            LAGO_CREATE_ORG: "false"
            LAGO_DATA_API_BEARER_TOKEN: ""
            LAGO_DATA_API_URL: http://data-api
            LAGO_DISABLE_PDF_GENERATION: "false"
            LAGO_DISABLE_SEGMENT: "true"
            LAGO_DISABLE_SIGNUP: "true"
            LAGO_DISABLE_WALLET_REFRESH: ""
            LAGO_FROM_EMAIL: ""
            LAGO_GCS_BUCKET: ""
            LAGO_GCS_PROJECT: ""
            LAGO_LICENSE: ""
            LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
            LAGO_ORG_API_KEY: ""
            LAGO_ORG_NAME: ${LAGO_ORG_NAME:-}
            LAGO_ORG_USER_EMAIL: ${LAGO_ORG_USER_EMAIL:-}
            LAGO_ORG_USER_PASSWORD: ${LAGO_ORG_USER_PASSWORD:-}
            LAGO_PDF_URL: http://pdf:3000
            LAGO_REDIS_CABLE_URL: redis://:${PANEL_REDIS_ROOT_PASSWORD}@persaas-redis:6379/8
            LAGO_REDIS_CACHE_MASTER_NAME: master
            LAGO_REDIS_CACHE_PASSWORD: ${PANEL_REDIS_ROOT_PASSWORD}
            LAGO_REDIS_CACHE_SENTINEL_PASSWORD: ""
            LAGO_REDIS_CACHE_SENTINEL_USERNAME: ""
            LAGO_REDIS_CACHE_SENTINELS: ""
            LAGO_REDIS_CACHE_URL: redis://persaas-redis:6379/7
            LAGO_REDIS_SIDEKIQ_MASTER_NAME: master
            LAGO_REDIS_SIDEKIQ_SENTINEL_PASSWORD: ""
            LAGO_REDIS_SIDEKIQ_SENTINEL_USERNAME: ""
            LAGO_REDIS_SIDEKIQ_SENTINELS: ""
            LAGO_SIDEKIQ_WEB: "true"
            LAGO_SMTP_ADDRESS: ""
            LAGO_SMTP_PASSWORD: ""
            LAGO_SMTP_PORT: "587"
            LAGO_SMTP_USERNAME: ""
            LAGO_USE_AWS_S3: "true"
            LAGO_USE_GCS: "false"
            LAGO_WEBHOOK_ALLOW_PRIVATE_URLS: "false"
            MISTRAL_AGENT_ID: ""
            MISTRAL_API_KEY: ""
            PGDATABASE: ${PANEL_DB_NAME:?Enter the database name}
            PGHOST: lago-postgres
            PGPASSWORD: ${PANEL_DB_USER_PASSWORD:?Enter the database password}
            PGPORT: ${PANEL_DB_PORT:?Missing database instance port}
            PGSSLMODE: ${DB_SSL_MODE:-disable}
            PGUSER: ${PANEL_DB_USER:?Enter the database user}
            RAILS_ENV: production
            RAILS_LOG_TO_STDOUT: "true"
            REDIS_PASSWORD: ${PANEL_REDIS_ROOT_PASSWORD}
            REDIS_URL: redis://persaas-redis:6379/6
        image: getlago/api:v1.57.0
        labels:
            createdBy: Apps
            skipStatusCheck: "true"
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        mem_limit: 1536m
        networks:
            1panel-network: {}
            default: null
        volumes:
            - ./secrets.rb:/lago-secrets.rb:ro
            - lago_secrets:/lago-secrets:ro
    pdf:
        command: null
        container_name: ${CONTAINER_NAME}-pdf
        deploy:
            resources:
                limits:
                    cpus: ${CPUS}
                    memory: ${MEMORY_LIMIT}
        entrypoint: null
        image: ghcr.io/getlago/lago-gotenberg:8.39
        labels:
            createdBy: Apps
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        mem_limit: 512m
        networks:
            default: null
    secrets-init:
        command:
            - --init
        container_name: ${CONTAINER_NAME}-secrets-init
        entrypoint:
            - ruby
            - /lago-secrets.rb
        environment:
            LAGO_ENCRYPTION_DETERMINISTIC_KEY: ${LAGO_ENCRYPTION_DETERMINISTIC_KEY:-}
            LAGO_ENCRYPTION_KEY_DERIVATION_SALT: ${LAGO_ENCRYPTION_KEY_DERIVATION_SALT:-}
            LAGO_ENCRYPTION_PRIMARY_KEY: ${LAGO_ENCRYPTION_PRIMARY_KEY:-}
            LAGO_RSA_PRIVATE_KEY: ${LAGO_RSA_PRIVATE_KEY:-}
            SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
        image: getlago/api:v1.57.0
        labels:
            createdBy: Apps
            skipStatusCheck: "true"
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        mem_limit: 256m
        network_mode: none
        user: "0:0"
        volumes:
            - ./secrets.rb:/lago-secrets.rb:ro
            - lago_secrets:/lago-secrets
volumes:
    lago_postgres: {}
    lago_secrets: {}
    lago_storage_data: {}
