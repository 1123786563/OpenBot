            LAGO_LICENSE: ""
            LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
            LAGO_ORG_API_KEY: ""
            LAGO_ORG_NAME: ""
            LAGO_ORG_USER_EMAIL: ""
            LAGO_ORG_USER_PASSWORD: ""
            LAGO_PDF_URL: http://pdf:3000
            LAGO_REDIS_CABLE_URL: redis://:${PANEL_REDIS_ROOT_PASSWORD}@persaas-redis:6379/8
            LAGO_REDIS_CACHE_MASTER_NAME: master
