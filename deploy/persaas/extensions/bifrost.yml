networks:
    1panel-network:
        external: true
    bifrost:
        ipam: {}
services:
    bifrost:
        command: null
        container_name: ${CONTAINER_NAME}-bifrost
        entrypoint: null
        environment:
            BIFROST_DB_HOST: 1Panel-pgvector-T1Hu
            BIFROST_DB_NAME: ${PANEL_DB_NAME:?Enter the database name}
            BIFROST_DB_PASSWORD: ${PANEL_DB_USER_PASSWORD:?Enter the database password}
            BIFROST_DB_PORT: ${PANEL_DB_PORT:?Missing database instance port}
            BIFROST_DB_SSL_MODE: ${DB_SSL_MODE:-disable}
            BIFROST_DB_USER: ${PANEL_DB_USER:?Enter the database user}
            BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN}
        extra_hosts:
            - host.docker.internal=host-gateway
        image: maximhq/bifrost:v2.6.0@sha256:5968d007ba4f74ee01bc4ceb071decb9927a0b7bb43dbb9072208f75e2d522e3
        labels:
            createdBy: Apps
        mem_limit: 512m
        networks:
            1panel-network: {}
            bifrost: null
        restart: unless-stopped
        volumes:
            - bifrost-data:/app/data
            - ./bifrost.json:/app/data/config.json:ro
    registry-proxy:
        command: null
        container_name: ${CONTAINER_NAME}
        depends_on:
            bifrost:
                condition: service_started
                required: true
        deploy:
            resources:
                limits:
                    cpus: ${CPUS}
                    memory: ${MEMORY_LIMIT}
        entrypoint: null
        image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
        labels:
            createdBy: Apps
        networks:
            1panel-network:
                aliases:
                    - openbot-bifrost
            bifrost: null
        ports:
            - ${HOST_IP}:${PANEL_APP_PORT_HTTP:-18080}:8080
        restart: unless-stopped
        volumes:
            - ./registry-proxy.conf:/etc/nginx/conf.d/default.conf:ro
            - ./publication-freeze.d:/etc/nginx/publication-freeze.d:ro
volumes:
    bifrost-data: {}
