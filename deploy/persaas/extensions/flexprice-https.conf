# Entry host: /opt/1panel/1panel/www/conf.d/flexprice.persaas.cn.conf
server {
    listen 80;
    server_name flexprice.persaas.cn;
    location ^~ /.well-known/acme-challenge/ { root /usr/share/nginx/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name flexprice.persaas.cn;
    ssl_certificate /www/sites/flexprice.persaas.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/flexprice.persaas.cn/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /www/sites/flexprice.persaas.cn/log/access.log;
    error_log /www/sites/flexprice.persaas.cn/log/error.log;
    include /www/sites/flexprice.persaas.cn/proxy/*.conf;
}
