name: openbot-server

x-openbot: &openbot
  image: ${OPENBOT_IMAGE:?Set OPENBOT_IMAGE}
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  migrate:
    <<: *openbot
    restart: "no"
    command: ["bun", "--no-env-file", "scripts/migrate.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    networks: [postgres]

  server:
    <<: *openbot
    # The server's own settings, then the agents': it picks each Bot's model from the settings the
    # Bots run with (deploy/agents/.env.example), so the model key and the tokens live there alone.
    env_file:
      - path: ${OPENBOT_SERVER_ENV_FILE:-.env.server}
      - path: ../agents/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:?Set WORKER_SHARED_SECRET}
      PORT: "3001"
      APP_PORT: ${OPENBOT_PORT:-18001}
    ports:
      - "127.0.0.1:${OPENBOT_PORT:-18001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3001/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 5s
      timeout: 4s
      retries: 12
    networks:
      default: {}
      postgres: {}
      agents:
        aliases: [openbot-api]
      telemetry: {}

  worker:
    <<: *openbot
    command: ["bun", "--no-env-file", "../worker/src/index.ts"]
    # The worker's own settings (.env.worker.example: the optional Lago export), and the server's:
    # it runs the server's billing and sign-in code. The database address and the shared secret are
    # the deployment's, given below.
    env_file:
      - path: ${OPENBOT_SERVER_ENV_FILE:-.env.server}
        required: false
      - path: ${OPENBOT_WORKER_ENV_FILE:-.env.worker}
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SERVER_INTERNAL_URL: http://server:3001
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:?Set WORKER_SHARED_SECRET}
    depends_on:
      server:
        condition: service_healthy
    networks: [default, postgres]

networks:
  postgres:
    external: true
    name: ${MIDDLEWARE_POSTGRES_NETWORK:-1panel-network}
  agents:
    external: true
    name: openbot-agents_default
  telemetry:
    external: true
    name: openbot-observability
