services:
  minio:
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  demo-data-generator:
    profiles: !override [demo]
  backend:
    ports: !reset []
  frontend:
    ports: !override
      - "127.0.0.1:${OPIK_PORT:-15173}:${NGINX_PORT:-5173}"
    networks:
      default: {}
      client:
        aliases: ["${OPIK_CLIENT_HOSTNAME:-opik-frontend}"]

networks:
  client:
    name: ${OPIK_CLIENT_NETWORK:-openbot-opik}
    internal: true
