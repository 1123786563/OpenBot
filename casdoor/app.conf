appname = casdoor
httpport = 8000
runmode = dev
copyrequestbody = true

# The OpenBot database, in Casdoor's own schema rather than a database of its own.
#
# Same PostgreSQL as OpenBot (the `postgres` service on the `data` network), same `openbot`
# database, everything Casdoor owns inside the `casdoor` schema created by
# casdoor/init-db.sql. Beego's postgres adapter takes `dbName` below as the schema name, so
# Casdoor's tables, its users and its application registrations all land there and never
# beside OpenBot's. A dedicated `casdoor` role owns that schema and has no rights on OpenBot's
# tables, so the two share a database the way two tenants share a building.
#
# The role's password is a local-development value, in this file for the same reason the
# compose file carries `openbot:openbot` for the database itself: the boundary is the loopback
# port and the `data` network, not the credential. A deployment changes both here and in
# casdoor/init-db.sql.
driverName = postgres
dataSourceName = "user=casdoor password=casdoor host=postgres port=5432 dbname=openbot sslmode=disable"
dbName = casdoor
tableNamePrefix =
showSql = false
redisEndpoint =
defaultStorageProvider =
isCloudIntranet = false
authState = "casdoor"
verificationCodeTimeout = 10
initScore = 0
logPostOnly = true
isUsernameLowered = false

# The address browsers reach Casdoor at, which from this stack is the published loopback
# port. OAuth redirects are absolute URLs built from this, so a deployment serving Casdoor
# behind its own hostname changes it here.
origin = http://localhost:8000
originFrontend =
staticBaseUrl = "https://cdn.casbin.org"
isDemoMode = false
batchSize = 100
showGithubCorner = false
forceLanguage = ""
defaultLanguage = "en"
defaultApplication = "app-built-in"
maxItemsForFlatMenu = 7
enableErrorMask = false
enableGzip = true
inactiveTimeoutMinutes =
ldapServerPort = 389
ldapsCertId = ""
ldapsServerPort = 636
radiusServerPort = 1812
radiusDefaultOrganization = "built-in"
radiusSecret = "secret"
quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
logConfig = {"adapter":"file", "filename": "logs/casdoor.log", "maxdays":99999, "perm":"0770"}
initDataNewOnly = false
initDataFile = "./init_data.json"
frontendBaseDir = "../cc_0"
