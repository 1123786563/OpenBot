# The Lago backend services' shared environment. Secrets never live here: they come from
# docker/lago/.env (generated by docker/lago/init-env.sh) through each service's `env_file`.
# The database is the shared postgres service, through a dedicated `lago` database and login
# role — the arrangement Casdoor and OpenConnector also have (their init-db.sql files), and
# the one Lago requires rather than merely prefers: Lago v1.53 hardcodes `public` three ways;
# see docker/lago/init-db.sql for the evidence and the trade.
x-lago-backend-environment: &lago-backend-environment
  DATABASE_URL: postgresql://lago:lago@postgres:5432/lago
  REDIS_URL: redis://lago-redis:6379
  LAGO_REDIS_CACHE_URL: redis://lago-redis:6379
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  LAGO_API_URL: http://127.0.0.1:${LAGO_API_PORT:-48889}
  LAGO_FRONT_URL: http://127.0.0.1:${LAGO_FRONT_PORT:-48890}
  LAGO_PDF_URL: http://lago-pdf:3000
  LAGO_SIDEKIQ_WEB: "true"
  LAGO_USE_AWS_S3: "false"
  LAGO_USE_GCS: "false"
  LAGO_DISABLE_SIGNUP: "false"
  LAGO_DISABLE_PDF_GENERATION: "false"
  LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com

services:
  postgres:
    # Plain PostgreSQL plus pg_partman. The pgvector base image this service used to build on
    # is gone: embeddings moved to Qdrant (the `qdrant` service below), the last Postgres-side
    # vector column was dropped in migration 0010, and nothing here needs the extension
    # anymore. The overlay that remains exists only for the `lago` profile's benefit — see
    # docker/postgres-partman.Dockerfile for why the extension has to be in the server itself —
    # and the data volume this stack already runs on is unaffected by the image swap.
    # Named like the other built images, and pullable the same way.
    build:
      context: .
      dockerfile: docker/postgres-partman.Dockerfile
    image: ${POSTGRES_IMAGE:-openbot-postgres:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    # Off the network the Bots are on, because a Bot's computer is on it and a Bot has a shell.
    #
    # With no `networks:` anywhere, Compose puts every service on one network with DNS by service
    # name, so `agent-computer` could open `postgres:5432` and the credentials three lines below are
    # in this file. That is the audit trail, the policy store and the agent tables, reachable from
    # the one container whose whole job is to run what a Bot asks for. `agent-computer/src/shell.ts`
    # says it plainly: isolation is the container's job, a shell can reach whatever the container
    # can reach.
    #
    # `migrate` is the only service that reaches this by name, so the two of them are all that
    # belongs here. Everything else that needs the database is outside this file: the API server
    # runs on the host in local development and connects through the published port below.
    environment:
      POSTGRES_DB: openbot
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: openbot
    ports:
      # Loopback, like every other port in this file, and for the reason the network split above
      # exists. Published on every interface, this is reachable from the Bot's computer at the
      # container's default gateway, which is the host: taking `postgres` off that network removes
      # the name and leaves the address. Proven from inside `agent-computer`, where the gateway on
      # :5432 answered and began authenticating as `openbot` on `openbot`, with the password in
      # this file. The server on the host still reaches it, because that is what loopback is.
      # Both loopback addresses, because `localhost` is not one address.
      #
      # It resolves to ::1 and 127.0.0.1 in an order the platform decides, and a client that gets
      # ::1 first does not fall back: Bun and Node both fail the connection outright rather than
      # trying the other. Publishing on one of them makes `localhost` work on some machines and not
      # others, for a reason nothing in the error mentions. Publishing on both is still loopback,
      # so nothing here is reachable from another host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
      - "[::1]:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Casdoor's role and database in the postgres this container owns. Read-only, and run by
      # the image's own entrypoint on the first boot of a fresh data volume only; the volume
      # this stack already runs on had it applied by hand, since init scripts do not run
      # against existing data.
      - ./casdoor/init-db.sql:/docker-entrypoint-initdb.d/10-casdoor.sql:ro
      # Lago's role and database on the postgres this stack already owns, in the spirit of
      # Casdoor's mount above. Read-only, and run by the image's own entrypoint on the first
      # boot of a fresh data volume only; the volume this stack already runs on had it applied
      # by hand, since init scripts do not run against existing data.
      - ./docker/lago/init-db.sql:/docker-entrypoint-initdb.d/20-lago.sql:ro
      # OpenConnector's role and database, the third of the three mounts above. Read-only,
      # first-boot-only, hand-applied to the volume this stack already runs on — same story
      # as Casdoor's and Lago's.
      - ./docker/openconnector/init-db.sql:/docker-entrypoint-initdb.d/30-openconnector.sql:ro
      # kb-mastra's role and database (metadata four tables only; vectors are in Qdrant).
      # Same story as the three above.
      - ./docker/kb-mastra/init-db.sql:/docker-entrypoint-initdb.d/40-kb-mastra.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbot -d openbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

  # The vector store. Embeddings live here and nowhere else: the last Postgres-side vector
  # column (chunks.embedding) was dropped in migration 0010, and the knowledge service that
  # owns embeddings talks to Qdrant over HTTP on 6333. Redis-style: one binary, no external
  # dependencies, storage in the named volume below — do not remove the volume or `docker rm`
  # takes the corpus with it.
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:1.19.2}
    # Loopback both stacks, like every other port in this file: the API server on the host
    # reaches it through the published port, nothing off the machine can.
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "[::1]:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The health endpoint answers 200 with the version once the HTTP API is up; no TCP
      # probing, because a listening socket says nothing about the REST API being served.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - data

  # The WeKnora knowledge domain ported to TypeScript + Mastra, replacing kb-service as the
  # KB_SERVICE_URL upstream. Reaches postgres (metadata four tables, its own kb_mastra database,
  # see docker/kb-mastra/init-db.sql), qdrant above (the only vector store, collection
  # kb_chunks_{dim}), openbot-redis (BullMQ ingest queue) and docreader below (gRPC parsing).
  # Switch upstreams by pointing KB_SERVICE_URL at http://kb-mastra:8082; the Go kb-service on
  # 8081 stays as the contract-comparison fallback.
  kb-mastra:
    build:
      context: .
      dockerfile: kb-mastra/Dockerfile
    image: ${KB_MASTRA_IMAGE:-openbot-kb-mastra:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    environment:
      KB_PORT: "8082"
      KB_DATABASE_URL: postgres://kb_mastra:${KB_MASTRA_DB_PASSWORD:-kb_mastra}@postgres:5432/kb_mastra
      KB_REDIS_URL: redis://openbot-redis:6379
      # Same variable names the main stack already uses (A13): one deployment, one value.
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      KB_QDRANT_BATCH: ${KB_QDRANT_BATCH:-40}
      KB_API_KEYS: ${KB_API_KEYS:-sk-kb-dev-001:tenant-a:admin}
      DOCREADER_ADDR: docreader:50051
      DOCREADER_CALL_TIMEOUT_MS: ${DOCREADER_CALL_TIMEOUT_MS:-1800000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      KB_EMBED_MODEL: ${KB_EMBED_MODEL:?set KB_EMBED_MODEL in .env}
      KB_EMBED_DIMENSIONS: ${KB_EMBED_DIMENSIONS:-1024}
      BATCH_EMBED_SIZE: ${BATCH_EMBED_SIZE:-5}
      KB_EMBED_MAX_CONCURRENCY: ${KB_EMBED_MAX_CONCURRENCY:-32}
      KB_RERANK_ENABLED: ${KB_RERANK_ENABLED:-false}
      KB_RERANK_URL: ${KB_RERANK_URL:-}
      KB_RERANK_MODEL: ${KB_RERANK_MODEL:-}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /data/kb-files
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      KB_VECTOR_THRESHOLD: ${KB_VECTOR_THRESHOLD:-0.15}
      KB_DEFAULT_TOP_K: ${KB_DEFAULT_TOP_K:-50}
    volumes:
      - kb-mastra-files:/data/kb-files
    ports:
      - "127.0.0.1:${KB_MASTRA_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      openbot-redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      docreader:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:8082/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - data

  # WeKnora's document parser, reused as-is: gRPC :50051, the heavy JVM/LibreOffice/Playwright
  # stack that turns PDF/DOCX/PPTX/HTML into markdown + source locators. kb-mastra dials it by
  # service name; nothing else in this stack speaks to it.
  docreader:
    image: ${DOCREADER_IMAGE:-wechatopenai/weknora-docreader:latest}
    restart: unless-stopped
    healthcheck:
      # gRPC health probing without grpcurl: the port accepting TCP is the best cheap signal
      # this image offers. kb-mastra's client retries connections anyway.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/50051' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - data

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    # Named, and pullable, for the same reason as agent-computer below: a release publishes this
    # image, and a machine that can name it does not need a toolchain to build it. `pull_policy`
    # is what decides between the two, because a service carrying a `build` section builds by
    # default however its image is named. IMAGE_PULL_POLICY=missing makes it pull instead.
    #
    # Not a guarantee that nothing is built: a pull that fails falls back to building, silently,
    # which is right for a developer and wrong for an installed OpenBot, where there is no
    # toolchain and the honest answer is that the image could not be fetched. Anything shipping
    # these images to a machine that cannot build them overrides the `build` section away rather
    # than relying on this variable.
    image: ${SERVER_IMAGE:-openbot-server:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    command: ["bun", "x", "drizzle-kit", "migrate", "--config=drizzle.config.ts"]
    environment:
      DATABASE_URL: postgres://openbot:openbot@postgres:5432/openbot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  # The Bot's computer is long-lived so browser sessions remain signed in across turns.
  agent-computer:
    build:
      context: .
      dockerfile: agent-computer/Dockerfile
    # Tagged explicitly because the supervisor starts one computer per Bot from this image by name,
    # and a Compose-derived name would change with the project.
    image: ${COMPUTER_IMAGE:-openbot-agent-computer:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    ports:
      # Loopback only. This process drives a browser holding real logins; COMPUTER_TOKEN is the
      # request control, and loopback keeps the surface off routed networks.
      - "127.0.0.1:${COMPUTER_PORT:-4100}:4100"
      - "[::1]:${COMPUTER_PORT:-4100}:4100"
    # Per-Bot egress, in a file of its own because the names are not knowable here.
    #
    # `EGRESS_PROXY_<BOT>` is derived from the Bot's id, so there is no fixed list to write out the
    # way COMPUTER_TOKEN is. Not `.env`: that holds the deployment's secrets, and this container
    # drives a browser and runs a Bot's shell, so it is given what it needs and not the rest.
    # Optional, because going out directly is the ordinary case and must still start.
    env_file:
      - path: ./egress.env
        required: false
    environment:
      # Traces flow to Tempo only when the observability profile is up and this points at it;
      # empty keeps the service recording locally without exporting (see shared/trace.ts).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${CONTAINER_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # The secret every caller must present. The container refuses to start without it.
      #
      # The default matches the one scripts/start.sh applies when .env leaves this blank, which
      # .env.example does. Without it the two paths disagree: the script exports a value and brings
      # the stack up working, while a plain `docker compose up -d` -- which this project's own
      # shutdown notes tell you to use -- hands the container an empty string instead. Reaches only
      # a loopback-bound port; a deployment sets a real value in .env.
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-openbot-dev-computer-token}
      # `headed` runs full Chromium behind the same streamed screen, so a person taking the wheel
      # gets a browser sites treat like their ordinary desktop browser. Headless remains the default.
      COMPUTER_BROWSER_MODE: ${COMPUTER_BROWSER_MODE:-headless}
      # How many Bots may hold a running browser at once, and how long an untouched one is kept.
      # A few hundred MB each, so on a deployment with many Bots these are the difference between
      # a container that holds steady and one that is killed for memory. Defaults are 8 and 30
      # minutes; closing a browser costs only a relaunch, because the profile is on the volume below.
      COMPUTER_MAX_BROWSERS: ${COMPUTER_MAX_BROWSERS:-}
      COMPUTER_BROWSER_IDLE_MS: ${COMPUTER_BROWSER_IDLE_MS:-}
    volumes:
      - agent-workspace:/workspace
      # Chromium's user-data directory is volume-backed so logins survive container restarts.
      - agent-profiles:/profiles
    # Gives Chromium time to flush its profile after SIGTERM before Docker sends SIGKILL.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:4100/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-sandbox:
    build:
      context: .
      dockerfile: agent-sandbox/Dockerfile
      # Set NPM_REGISTRY in .env when the default registry is unreachable for the ~60MB opencode
      # binary packages (e.g. https://registry.npmmirror.com from a constrained network).
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: ${SANDBOX_IMAGE:-openbot-agent-sandbox:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    ports:
      # Loopback only: the sandbox runs arbitrary generated code; the token is the request
      # control and the published loopback keeps the surface off routed networks.
      - "127.0.0.1:${SANDBOX_PORT:-4300}:4300"
      - "[::1]:${SANDBOX_PORT:-4300}:4300"
    # Unprivileged, cap-less, no privilege escalation — the same posture Craft's Docker backend
    # provisions its per-user sandboxes with (docker_sandbox_manager.py).
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${SANDBOX_DOCKER_MEMORY_LIMIT:-2g}
    cpus: ${SANDBOX_DOCKER_CPU_LIMIT:-2}
    networks:
      - openbot_sandbox
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-openbot-dev-sandbox-token}
      # The model route, shared with the server's own GLM configuration in local development.
      SANDBOX_PROVIDER_BASE_URL: ${OPENAI_BASE_URL}
      SANDBOX_PROVIDER_API_KEY: ${OPENAI_API_KEY}
      SANDBOX_MODEL: ${BOT_MODEL:-GLM-5.3}
      # Per-bot lifecycle: each Bot gets its own opencode serve under /workspace/bots/<botId>.
      # Idle ones are reaped after SANDBOX_UPSTREAM_IDLE_MS (default 10 minutes) by a sweep that
      # runs every SANDBOX_SWEEP_INTERVAL_MS; SANDBOX_UPSTREAM_PORT_BASE is the first port a
      # per-bot serve may take. Workspace TTL sweeping is OFF by default (0): deleting a user's
      # files automatically must be an explicit opt-in.
      SANDBOX_UPSTREAM_IDLE_MS: ${SANDBOX_UPSTREAM_IDLE_MS:-600000}
      SANDBOX_SWEEP_INTERVAL_MS: ${SANDBOX_SWEEP_INTERVAL_MS:-60000}
      SANDBOX_UPSTREAM_PORT_BASE: ${SANDBOX_UPSTREAM_PORT_BASE:-4400}
      SANDBOX_WORKSPACE_TTL_MS: ${SANDBOX_WORKSPACE_TTL_MS:-0}
    volumes:
      - openbot-sandbox-workspace:/workspace
      - openbot-sandbox-config:/config
    restart: unless-stopped

  # OpenBot's own Redis — turn locks and event fan-out for the workshop — named to stay
  # unmistakable from lago-redis and glitchtip-redis, which belong to other stacks. Pure memory
  # (`--save '' --appendonly no`): persisting it would carry lock state across restarts and
  # resurrect locks whose owner process is long gone. On `data` beside postgres and never on
  # `openbot_sandbox`: a sandbox container must not be able to resolve Redis. Port published to
  # loopback only, like every other port in this file.
  openbot-redis:
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: --port 6379 --save '' --appendonly no
    restart: unless-stopped
    volumes:
      - openbot-redis-data:/data
    ports:
      - "127.0.0.1:${OPENBOT_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${OPENBOT_REDIS_MEM_LIMIT:-256m}
    networks:
      - data

  # Bot identity is attested by SPIRE when these optional services run.
  #
  # SPIRE issues each computer an SVID based on the container labels set by the supervisor. A
  # computer cannot claim another Bot's identity, and an unregistered container receives no identity.
  #
  # Optional. Without these two services the product runs without workload identity and reports that
  # state explicitly.
  # Fresh named volumes arrive owned by root, while SPIRE runs as uid 1000. This one-shot service
  # assigns ownership without running the CA or agent as root.
  spire-init:
    image: busybox:1.37
    command: ["sh", "-c", "chown -R 1000:1000 /server /agent"]
    user: "0:0"
    volumes:
      - spire-server-data:/server
      - spire-agent-data:/agent

  spire-server:
    image: ghcr.io/spiffe/spire-server:1.15.1
    depends_on:
      spire-init:
        condition: service_completed_successfully
    command: ["-config", "/opt/spire/conf/server.conf"]
    volumes:
      - ./spire/server.conf:/opt/spire/conf/server.conf:ro
      # Mounted at the directory the image already owns so SPIRE can create its datastore as uid 1000.
      - spire-server-data:/opt/spire/data
      - spire-server-socket:/tmp/spire-server/private
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.15.1
    command: ["-config", "/opt/spire/conf/agent.conf", "-joinToken", "${SPIRE_JOIN_TOKEN:-openbot-dev-token}"]
    # The agent must see the caller's process to map the Workload API peer to a Docker container. The
    # host PID namespace is required because the attestor reads the peer cgroup from that pid.
    pid: host
    depends_on:
      spire-server:
        condition: service_healthy
      spire-init:
        condition: service_completed_successfully
    volumes:
      - ./spire/agent.conf:/opt/spire/conf/agent.conf:ro
      - spire-agent-socket:/tmp/spire-agent/public
      - spire-agent-data:/opt/spire/data
      # Read-only, and only so the docker workload attestor can see which container is asking.
      - ${ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro

  # One computer per Bot.
  #
  # Each Bot gets a container with its own files, browser session and processes. The Docker socket is
  # root-equivalent on the host, so only the supervisor holds it and only exposes Bot-level verbs.
  # The SPIRE agent mounts the socket read-only to attest workloads and creates nothing.
  supervisor:
    build:
      context: .
      dockerfile: supervisor/Dockerfile
    # Published by a release; see migrate above for what pull_policy decides.
    image: ${SUPERVISOR_IMAGE:-openbot-supervisor:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    # The same file, because this process does not read these itself: it forwards every EGRESS_PROXY
    # key out of its own environment into each computer it creates, so it has to be given them first.
    env_file:
      - path: ./egress.env
        required: false
    environment:
      PORT: "4300"
      # Traces flow to Tempo only when the observability profile is up and this points at it;
      # empty keeps the service recording locally without exporting (see shared/trace.ts).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${CONTAINER_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Shared with the API server. The Bot-level verb set is the boundary; this token keeps other
      # services on the network from calling those verbs.
      # Defaulted for the same reason as agent-computer's above: so `docker compose up -d` by hand
      # configures the same stack scripts/start.sh does, rather than a silently unauthenticated one.
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:-openbot-dev-supervisor-token}
      # Handed to every computer this creates, so the server and the computers share one secret.
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-openbot-dev-computer-token}
      # Forwarded into every per-Bot computer the supervisor creates.
      COMPUTER_BROWSER_MODE: ${COMPUTER_BROWSER_MODE:-headless}
      COMPUTER_IMAGE: ${COMPUTER_IMAGE:-openbot-agent-computer:latest}
      # Which deployment the computers it creates belong to, so two stacks on one Docker host never
      # derive the same container and volume names for the same Bot.
      COMPUTER_NAMESPACE: ${COMPUTER_NAMESPACE:-openbot}
      # Empty by default because the API server runs on the host in local development and reaches
      # computers by published loopback ports. Deployments running the server inside this network set
      # the network name so computers publish no host ports.
      COMPUTER_NETWORK: ${COMPUTER_NETWORK:-}
      # Set to runsc to run every computer under gVisor, when the host has it. Left unset each
      # computer is an ordinary container and shares the host kernel.
      COMPUTER_RUNTIME: ${COMPUTER_RUNTIME:-}
      # Identity, when SPIRE is part of this deployment. The supervisor registers an entry per Bot
      # and mounts the agent's socket into that Bot's computer so it can fetch its own SVID.
      SPIRE_SOCKET: /tmp/spire-server/private/api.sock
      SPIRE_TRUST_DOMAIN: openbot.local
      SPIRE_AGENT_ID: spiffe://openbot.local/spire/agent/join_token/${SPIRE_JOIN_TOKEN:-openbot-dev-token}
      SPIRE_AGENT_SOCKET_VOLUME: ${COMPOSE_PROJECT_NAME:-openbot}_spire-agent-socket
    ports:
      # For the server on the host to ask for a Bot's computer.
      #
      # Loopback only, like the computer's own port and for a stronger version of the same reason.
      # This process holds the Docker socket, so reaching it is root on the host through four verbs,
      # and SUPERVISOR_TOKEN is a shared secret rather than a network boundary. Published without an
      # interface in front of it this answered every address the host has.
      #
      # A deployment running the server inside this network does not use this mapping at all: it sets
      # COMPUTER_NETWORK and reaches the supervisor as `supervisor:4300`, which is unaffected because
      # the process still listens on every interface inside its own container.
      - "127.0.0.1:${SUPERVISOR_PORT:-4500}:4300"
      - "[::1]:${SUPERVISOR_PORT:-4500}:4300"
    volumes:
      # Read-only because this service only ever needs to ask; it is still root-equivalent, which is
      # the whole reason nothing else here gets it.
      #
      # The source is a setting because the default is wrong on one of the engines this runs on.
      # Docker puts its socket at this path, and so does Podman on macOS, where `podman machine`
      # symlinks it to the rootless socket inside the virtual machine. Rootless Podman on Linux does
      # not: the path is either absent or, with podman-docker installed, a symlink to
      # /run/podman/podman.sock, which is the *rootful* socket and is not the one running. The
      # supervisor then holds a dead socket and reports that it cannot reach Docker. Point
      # ENGINE_SOCKET at $XDG_RUNTIME_DIR/podman/podman.sock there.
      - ${ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      # To register an entry per Bot as each computer is created.
      - spire-server-socket:/tmp/spire-server/private
    security_opt:
      # The engine socket carries an SELinux label this container is not allowed to read.
      - label=disable
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:4300/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # The built-in Bot is an AG-UI endpoint registered the same way as a customer-provided Bot.
  agent-bot:
    build:
      context: .
      dockerfile: agent-bot/Dockerfile
    # Published by a release; see migrate above for what pull_policy decides.
    image: ${BOT_IMAGE:-openbot-agent-bot:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    ports:
      # Loopback, not every interface. The token is the boundary; this means an attacker needs to be
      # on the machine before they can even try it. Nothing legitimate reaches a Bot from another
      # host: the server calls it over localhost, and other containers use the compose network.
      - "127.0.0.1:${BOT_PORT:-4200}:4200"
      - "[::1]:${BOT_PORT:-4200}:4200"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Traces flow to Tempo only when the observability profile is up and this points at it;
      # empty keeps the service recording locally without exporting (see shared/trace.ts).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${CONTAINER_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Server sends this on every call to the managed Bot. It refuses to start without it.
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      # Unset means OpenAI. Set, it is any endpoint speaking the same API, and BOT_MODEL is sent
      # to it verbatim.
      OPENAI_BASE_URL: ${OPENAI_CONTAINER_BASE_URL:-${OPENAI_BASE_URL:-}}
      # gpt-5.5, not the deployment default: this Bot writes /v1/chat/completions by hand, and
      # gpt-5.6-* rejects function tools there unless reasoning is turned off. Its own variable, so
      # a BOT_MODEL set for the framework Bot cannot silently take its tools away.
      BOT_MODEL: ${AGENT_BOT_MODEL:-gpt-5.5}
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:4200/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # The harness somebody picked during setup, whichever one it is.
  #
  # ONE SERVICE RATHER THAN TWELVE, because a picked harness is a choice and not twelve branches in
  # this file. The image and the port come from `.env`, which the shell writes from the pick, and
  # both are facts about the image: each harness fixes its own port in its own Dockerfile.
  #
  # Behind a profile so a deployment that has picked nothing does not try to start it. Without that
  # an unset `PICKED_HARNESS_IMAGE` becomes a request to pull the empty string, which fails the
  # whole `compose up` rather than the one service nobody asked for.
  #
  # No `build:`, so `pull_policy` cannot be `build` here as it is elsewhere: this image is only ever
  # published, never built from this tree.
  agent-harness:
    profiles: ["harness"]
    image: ${PICKED_HARNESS_IMAGE:-}
    pull_policy: missing
    ports:
      # Loopback, and on the image's own port on both sides. The server is a host process, so it
      # reaches this the same way it reaches agent-bot: over the published port, not the compose
      # network.
      - "127.0.0.1:${PICKED_HARNESS_PORT:-4202}:${PICKED_HARNESS_PORT:-4202}"
      - "[::1]:${PICKED_HARNESS_PORT:-4202}:${PICKED_HARNESS_PORT:-4202}"
    environment:
      # Every harness refuses without this; it is what makes the endpoint the server's alone.
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      # Deployment-owned tools use the same signed callback as agent-langgraph.
      OPENBOT_TOOL_URL: ${OPENBOT_TOOL_URL:-http://host.docker.internal:3001/api/agent-tools/call}
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:-}
      # Whichever the model screen chose. A harness reads the one its provider needs and ignores the
      # rest, and the ones the choice did not imply are written empty rather than left stale: see
      # `ModelCredential`.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_CONTAINER_BASE_URL:-${OPENAI_BASE_URL:-}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENERATIVE_AI_BASE_URL: ${GOOGLE_GENERATIVE_AI_BASE_URL:-}
      BOT_PROVIDER: ${BOT_PROVIDER:-openai}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # A path into the mount below, set only when a ChatGPT plan was signed in to. The file is
      # there either way; this variable is what tells the harness to read it.
      CHATGPT_AUTH_FILE: ${CHATGPT_AUTH_FILE:-}
      BOT_MODEL: ${BOT_MODEL:-gpt-5.5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # A bind mount, not a named volume, and read-write on purpose. The signed-in plan's access
      # token expires within the hour and the harness renews it, so the renewal has to land back on
      # this machine or every restart would replay a refresh token that had already been spent.
      #
      # The provider writes by atomically replacing the file with a sibling temporary file, so the
      # mount has to be the containing directory rather than the file mount point.
      - ./.langchain:/root/.langchain

  # The same Bot behavior on a framework, exposed as another AG-UI endpoint and registry row.
  agent-langgraph:
    build:
      context: .
      dockerfile: agent-langgraph/Dockerfile
    # Published by a release; see migrate above for what pull_policy decides.
    image: ${LANGGRAPH_IMAGE:-openbot-agent-langgraph:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    ports:
      # Loopback, for the same reason as agent-bot above.
      - "127.0.0.1:${LANGGRAPH_PORT:-4201}:4201"
      - "[::1]:${LANGGRAPH_PORT:-4201}:4201"
    environment:
      # The selected provider reads its own key. Models requiring the Responses API use
      # BOT_RESPONSES_API instead of changing the streaming loop here.
      BOT_PROVIDER: ${BOT_PROVIDER:-openai}
      # Same server-to-Bot request boundary as agent-bot above.
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_CONTAINER_BASE_URL:-${OPENAI_BASE_URL:-}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENERATIVE_AI_BASE_URL: ${GOOGLE_GENERATIVE_AI_BASE_URL:-}
      # Unset, this Bot takes the spec file's row for its model rather than this line
      # substituting gpt-5.5 whatever BOT_PROVIDER named — a provider other than OpenAI was
      # handed that substitute and then failed at its own vendor on it. The file's OpenAI row is
      # the same gpt-5.5 as before, so an OpenAI deployment answers on the model it always did;
      # BOT_MODEL still wins when it is set, and a 5.6 tier named there switches the Responses
      # API on by itself below.
      BOT_MODEL: ${BOT_MODEL:-}
      BOT_RESPONSES_API: ${BOT_RESPONSES_API:-false}
      # How hard it thinks, on a model that reasons. Empty leaves the provider's own default.
      BOT_REASONING_EFFORT: ${BOT_REASONING_EFFORT:-}
      # Where this Bot runs a tool: back through the deployment that granted it, never at the vendor.
      # `host.docker.internal` because the API server runs on the host, not in this network.
      OPENBOT_TOOL_URL: ${OPENBOT_TOOL_URL:-http://host.docker.internal:3001/api/agent-tools/call}
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:4201/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # The Go runtime candidate (docs/superpowers/plans/2026-10-09-enterprise-ai-01-runtime.md):
  # a verification-candidate execution runtime the ENTERPRISE entry's run gateway dials.
  # Off by default — the `go-runtime` profile only starts when asked for:
  #   docker compose --profile go-runtime up go-runtime
  # It serves the enterprise wire (three-header authenticated execution/cancel), validates
  # identity against the enterprise entry's /internal/enterprise/v1/runtime/validate, and calls
  # governed tools back through /internal/enterprise/v1/tool-invocations. Nothing here touches
  # the legacy deployment's bot registry.
  go-runtime:
    profiles: ["go-runtime"]
    build:
      context: ./runtime-go
      dockerfile: Dockerfile
    image: ${GO_RUNTIME_IMAGE:-openbot-go-runtime:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    ports:
      # Loopback only: the enterprise entry (a host process) is the sole caller.
      - "127.0.0.1:${GO_RUNTIME_PORT:-4203}:4203"
      - "[::1]:${GO_RUNTIME_PORT:-4203}:4203"
    environment:
      # The shared service credential; the enterprise entry must carry the same value.
      OPENBOT_RUNTIME_SERVICE_CREDENTIAL: ${ENTERPRISE_RUNTIME_SERVICE_CREDENTIAL:-}
      # The model credential is optional only for the isolated fake provider.
      OPENBOT_RUNTIME_MODEL_CREDENTIAL: ${ENTERPRISE_RUNTIME_MODEL_CREDENTIAL:-${OPENAI_API_KEY:-}}
    # Every required flag (runtimeconfig refuses to boot with any missing).
    command:
      - "-addr=0.0.0.0:4203"
      - "-validation-endpoint=${ENTERPRISE_RUNTIME_VALIDATE_URL:-http://host.docker.internal:3101/internal/enterprise/v1/runtime/validate}"
      - "-model-base-url=${ENTERPRISE_RUNTIME_MODEL_BASE_URL:-https://open.bigmodel.cn/api/coding/paas/v4}"
      - "-model-alias=${ENTERPRISE_RUNTIME_MODEL_ALIAS:-GLM-5.3}"
      - "-model-route-ref=${ENTERPRISE_RUNTIME_MODEL_ROUTE_REF:-glm-53-default}"
      - "-expert=assistant-v1=/experts/assistant-v1.txt"
      - "-governed-tools=${ENTERPRISE_RUNTIME_GOVERNED_TOOLS:-}"
      - "-callback-endpoint=${ENTERPRISE_RUNTIME_CALLBACK_URL:-http://host.docker.internal:3101/internal/enterprise/v1/tool-invocations}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The identity provider OpenBot signs in through, when CASDOOR_OAUTH_* is configured.
  #
  # On the `data` network beside the database it shares, which is the same trust as `migrate`
  # and not the Bot side of the split above: Casdoor holds sign-in credentials rather than
  # running anything a Bot asks for, so it is a service the deployment trusts with its own
  # data, and it reaches `postgres` by name rather than through the published port.
  #
  # Its own database on that postgres, through the dedicated `casdoor` login role
  # (casdoor/init-db.sql): its tables, users and application registrations cannot see
  # OpenBot's, and OpenBot's migrations cannot see Casdoor's. Stateless in the same sense as
  # before: recreating this container loses nothing, because everything it owns lives in the
  # postgres volume.
  casdoor:
    image: casbin/casdoor:latest
    restart: unless-stopped
    ports:
      # Loopback, like every other port in this file. This is the address in
      # CASDOOR_OAUTH_ISSUER and the one browsers are sent to for the sign-in page; the
      # server on the host reaches it the same way.
      - "127.0.0.1:${CASDOOR_PORT:-8000}:8000"
      - "[::1]:${CASDOOR_PORT:-8000}:8000"
    volumes:
      - ./casdoor/app.conf:/conf/app.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  # Lago, the billing provider OpenBot's billing seam talks to when a deployment configures
  # LAGO_API_URL and friends. Behind the `lago` profile because a deployment that has
  # configured no billing has no need of a billing stack: `docker compose --profile lago up -d`
  # starts it, and a plain `docker compose up -d` never does.
  #
  # Same arrangement as Casdoor just above, one step wider in what it demands: it shares the
  # existing postgres through a dedicated `lago` database and login role (Lago cannot live in
  # a non-public schema — docker/lago/init-db.sql has the evidence), and it sits on the `data`
  # network because it holds billing credentials rather than running anything a Bot asks for.
  # Redis and the PDF renderer are Lago's own dependencies and belong to nobody else, so they
  # are Lago-named services with Lago-scoped volumes.
  #
  # Images digest-pinned to getlago/lago v1.53.0, the release OpenBot's client and webhook
  # verifier were integration-tested against. Partman-less on purpose; see
  # docker/lago/init-db.sql for what that trades away and why.

  lago-redis:
    profiles: ["lago"]
    image: redis@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    restart: unless-stopped
    command: --port 6379
    volumes:
      - lago-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  lago-pdf:
    profiles: ["lago"]
    image: getlago/lago-gotenberg@sha256:e8eef6fb4a92a3440c70d06598b385e7eb2ec7fb2d9b908ca4aa028741a0b270
    restart: unless-stopped
    networks:
      - data

  # One-shot: runs Lago's migrations against the lago schema, and on the very first boot also
  # mints the operator account and organization API key from the LAGO_ORG_* seed values in
  # docker/lago/.env.
  lago-migrate:
    profiles: ["lago"]
    image: getlago/api@sha256:4d1001772009beea6348b95b24938c3c289574516a312b1c191e83adbb546c8b
    command: ["./scripts/migrate.sh"]
    env_file: ./docker/lago/.env
    environment: *lago-backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  lago-api:
    profiles: ["lago"]
    image: getlago/api@sha256:4d1001772009beea6348b95b24938c3c289574516a312b1c191e83adbb546c8b
    restart: unless-stopped
    command: ["./scripts/start.api.sh"]
    env_file: ./docker/lago/.env
    environment: *lago-backend-environment
    volumes:
      - lago-storage-data:/app/storage
    ports:
      # Loopback, like every other port in this file. This is the LAGO_API_URL a deployment
      # configures on OpenBot's side; the browser-only frontend is the port below.
      - "127.0.0.1:${LAGO_API_PORT:-48889}:3000"
      - "[::1]:${LAGO_API_PORT:-48889}:3000"
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 30s
    networks:
      - data

  lago-front:
    profiles: ["lago"]
    image: getlago/front@sha256:16646b2b1c834f110e57e3460d09cf24c7a487ced721f50f5886d65d4d6228af
    restart: unless-stopped
    environment:
      API_URL: http://127.0.0.1:${LAGO_API_PORT:-48889}
      APP_ENV: production
      LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
      LAGO_DISABLE_PDF_GENERATION: "false"
    ports:
      - "127.0.0.1:${LAGO_FRONT_PORT:-48890}:80"
      - "[::1]:${LAGO_FRONT_PORT:-48890}:80"
    depends_on:
      lago-api:
        condition: service_healthy
    networks:
      - data

  lago-worker:
    profiles: ["lago"]
    image: getlago/api@sha256:4d1001772009beea6348b95b24938c3c289574516a312b1c191e83adbb546c8b
    restart: unless-stopped
    command: ["./scripts/start.worker.sh"]
    env_file: ./docker/lago/.env
    environment: *lago-backend-environment
    volumes:
      - lago-storage-data:/app/storage
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 30s
    networks:
      - data

  lago-clock:
    profiles: ["lago"]
    image: getlago/api@sha256:4d1001772009beea6348b95b24938c3c289574516a312b1c191e83adbb546c8b
    restart: unless-stopped
    command: ["./scripts/start.clock.sh"]
    env_file: ./docker/lago/.env
    environment: *lago-backend-environment
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - data

  # OpenConnector, the self-hosted broker behind this deployment's own app catalogue. Unlike every
  # other broker here it is a container of this deployment's: the credentials people type stay in
  # the volume below, encrypted by the container when OPENCONNECTOR_ENCRYPTION_KEY is set, and
  # reachable by nobody outside this machine.
  open-connector:
    image: ghcr.io/oomol-lab/open-connector:latest   # pin to a digest when cutting a release
    restart: unless-stopped
    environment:
      OOMOL_CONNECT_ADMIN_TOKEN: ${OPENCONNECTOR_ADMIN_TOKEN:-}
      OOMOL_CONNECT_RUNTIME_TOKEN: ${OPENCONNECTOR_RUNTIME_TOKEN:-}
      OOMOL_CONNECT_ENCRYPTION_KEY: ${OPENCONNECTOR_ENCRYPTION_KEY:-}
      # Escape hatch for a proxy/VPN whose fake-IP DNS maps public domains into reserved ranges
      # (198.18.0.0/15, fc00::/7). Empty keeps OpenConnector's egress protection at full strength.
      OOMOL_CONNECT_EGRESS_TRUSTED_HOSTS: ${OPENCONNECTOR_EGRESS_TRUSTED_HOSTS:-}
      # This deployment's own `openconnector` database on the shared postgres
      # (docker/openconnector/init-db.sql), the same dedicated-database arrangement as
      # Casdoor's and Lago's. A deployment points this at its own external Postgres by
      # setting OPENCONNECTOR_DATABASE_URL in .env instead. PostgreSQL mode needs an explicit
      # migrate before first start on a fresh database:
      # `docker compose run --rm open-connector npm run runtime:migrate`.
      OOMOL_CONNECT_DATABASE_URL: ${OPENCONNECTOR_DATABASE_URL:-postgres://openconnector:openconnector@postgres:5432/openconnector}
    volumes:
      - open-connector-data:/app/data
    networks:
      # The broker dials Postgres by service name, so it rides the same network migrate and
      # agent-computer use to reach it. Nothing else needs it — the API server reaches this
      # container over loopback, not over the compose network.
      - data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback, like every other port in this file. The API server runs on the host and reaches
      # the broker at OPENCONNECTOR_URL, http://localhost:3100 by default; the two tokens are the
      # boundary against everything else on this machine. Both loopback families, for the reason
      # postgres gives above: `localhost` is not one address, and a host-run Bun server does not
      # fall back from the family it tried first.
      - "127.0.0.1:3100:3000"
      - "[::1]:3100:3000"

  # ── Observability: the LGTM stack plus Alloy, behind the `observability` profile. ──
  #
  # `docker compose --profile observability up -d` starts it; a plain `docker compose up -d`
  # never does — the same arrangement as `lago` above, because a deployment that has configured
  # no telemetry has no need of five more containers. The server points at the stack with
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 (uncomment it in .env after the stack is
  # up); every port below is loopback-only, like every other port in this file.
  #
  # No depends_on between any of these: Alloy's loki.write retries a Loki that is not up yet,
  # and Grafana's provisioning does not need the datasources to answer at boot. Alloy ships the
  # logs of every container on the machine into Loki (docker.sock, read-only) and tails .logs
  # for the host-run processes; Grafana auto-provisions the three datasources and the starter
  # dashboard from docker/observability/provisioning. Container-side addresses are service names
  # on `default` (http://loki:3102, http://tempo:4318); the published loopback ports are the
  # host-side contract (Grafana 3003, Loki 3102, Tempo 3200 + OTLP 4318/4317, Prometheus 9090).

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.5.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./docker/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      # Loopback, like every other port in this file. Loki listens on 3102 inside as well, so
      # the published port, Alloy's push URL (http://loki:3102) and Grafana's datasource all
      # name the same port; 3100 on the host belongs to open-connector.
      - "127.0.0.1:${LOKI_PORT:-3102}:3102"
      - "[::1]:${LOKI_PORT:-3102}:3102"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3102/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.7.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./docker/observability/tempo-config.yaml:/etc/tempo/config.yaml:ro
      # /var/tempo, not /tempo: the tempo image's ENTRYPOINT binary lives at /tempo, so the
      # data volume mounts beside it.
      - tempo-data:/var/tempo
    ports:
      # Loopback, like every other port in this file. 3200 is the query API the browser and
      # Grafana use; 4318/4317 are the OTLP HTTP/gRPC receivers the server points
      # OTEL_EXPORTER_OTLP_ENDPOINT at.
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
      - "[::1]:${TEMPO_PORT:-3200}:3200"
      - "127.0.0.1:${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
      - "[::1]:${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
      - "[::1]:${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Loopback, like every other port in this file. Scrapes itself here; application targets
      # land in docker/observability/prometheus.yml when the server is containerized.
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
      - "[::1]:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.10.0
    restart: unless-stopped
    # Root, so the read-only docker.sock below is openable whatever gid it carries on the host.
    user: root
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.logs:/hostlogs
      - ./docker/observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      # Positions/state for the log tails. A named volume so a container rebuild resumes where
      # the last one stopped instead of re-reading the whole .logs history into Loki.
      - alloy-data:/var/lib/alloy/data
    ports:
      # Loopback: Alloy's own UI/HTTP port, for debugging the pipeline only. Nothing depends on it.
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      # Datasources and the dashboard provider are provisioned, not clicked into existence: the
      # provider yaml is mounted alone so the sibling dashboard JSON is not mistaken for a
      # second provider definition.
      - ./docker/observability/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/observability/provisioning/dashboards/provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ./docker/observability/provisioning/dashboards/openbot-starter.json:/var/lib/grafana/dashboards/openbot-starter.json:ro
    ports:
      # Loopback, like every other port in this file. This is the address in the docs: the
      # starter dashboard is at http://127.0.0.1:3003, 3000 inside is Grafana's own.
      - "127.0.0.1:${GRAFANA_PORT:-3003}:3000"
      - "[::1]:${GRAFANA_PORT:-3003}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # GlitchTip, the crash-reporting sink: a Sentry-protocol server the client SDKs (P5) point
  # their DSNs at. Behind the `observability` profile with the five above — a deployment that
  # has configured no telemetry has no need of it, and a plain `docker compose up -d` never
  # starts it.
  #
  # Own postgres and redis rather than sharing this stack's: GlitchTip's upgrade path is
  # recreate-from-scratch (wipe the volume, re-register, re-issue DSNs), and neither its
  # migration-owned schema nor its throwaway lifecycle belongs on the volume OpenBot's tables
  # live on — docker/observability/glitchtip-init-db.sql has that argument.
  #
  # Tag pinned to the release verified below; `latest` moves without telling us. v6 runs web
  # (granian) and worker (django-vtasks) as one process when GLITCHTIP_EMBED_WORKER is set, and
  # runs its migrations itself at boot, so this is three containers and not five. The image
  # ships neither curl nor wget, so the healthcheck is a python one-liner against `/_health/`.
  glitchtip:
    profiles: ["observability"]
    image: glitchtip/glitchtip:6.2.6
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      # Forced, not defaulted: Django signs sessions and password resets with it, so a
      # placeholder would look healthy and still not be one. Generated once per deployment:
      #   openssl rand -hex 32
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set GLITCHTIP_SECRET_KEY in .env}
      # The host DSNs are minted against — also what the browser UI is served on, so the
      # browser and the SDKs see the same DSN host.
      GLITCHTIP_DOMAIN: http://127.0.0.1:${GLITCHTIP_PORT:-8001}
      # One process for web and worker; see the block comment above.
      GLITCHTIP_EMBED_WORKER: "true"
    ports:
      # Loopback, like every other port in this file: crash reports carry stack traces and
      # environment details, and the DSN's key is the only credential on that path. 8001
      # because 8000 is Casdoor's and 8080 is unassigned convention.
      - "127.0.0.1:${GLITCHTIP_PORT:-8001}:8000"
      - "[::1]:${GLITCHTIP_PORT:-8001}:8000"
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_started
    healthcheck:
      # `/_health/` answers 200 once migrations have run; the start_period below absorbs the
      # first boot's migrate on a fresh volume.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/_health/').read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  glitchtip-postgres:
    profiles: ["observability"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
    volumes:
      - glitchtip-db:/var/lib/postgresql/data
      # Belt and braces on the fresh-volume path: the POSTGRES_* env above already creates this
      # role and database, and the script's guards make the second attempt a no-op. Mounted the
      # same way casdoor's and lago's are so the ownership contract is written down, not implied.
      - ./docker/observability/glitchtip-init-db.sql:/docker-entrypoint-initdb.d/10-glitchtip.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 5s
      timeout: 5s
      retries: 10

  glitchtip-redis:
    profiles: ["observability"]
    image: redis:7-alpine
    restart: unless-stopped
    command: --port 6379
    volumes:
      - glitchtip-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # The database and the services that reach it by name. Nothing a Bot can reach is on it.
  #
  # A deployment that runs the API server inside Compose rather than on the host puts that service
  # on both this and `default`, which is the one place the two are meant to meet.
  data:
  # Everything else, which is where `default` already put it. Named here only so that adding a
  # service without a `networks:` key keeps landing beside the Bots rather than beside the database.
  default:
  # Dedicated bridge: the sandbox resolves nothing of the compose stack by service name
  # (postgres/redis/minio unreachable), while outbound internet — the model endpoint — still
  # works. A containerized API server joins this network too when it exists.
  openbot_sandbox:

volumes:
  postgres-data:
  qdrant-data:
  kb-mastra-files:
  lago-redis-data:
  lago-storage-data:
  open-connector-data:
  agent-workspace:
  spire-server-data:
  spire-server-socket:
  spire-agent-socket:
  spire-agent-data:
  agent-profiles:
  openbot-redis-data:
  openbot-sandbox-workspace:
  openbot-sandbox-config:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
  alloy-data:
  glitchtip-db:
  glitchtip-redis-data:
