# The main local stack. The optional stacks live in docker/compose/ — services.yml,
# lago.yml, observability.yml, opik.yml — beside the support files they mount. Start this file
# first; reference/compose.md carries the map, the start order and the --project-directory . invocation.
# opik.yml — optional self-hosted AI observability and evaluation; see docs/opik.md. Its OTLP
# host ports are 5418/5417 because observability.yml already owns 4318/4317 for Tempo.
services:
  postgres:
    # Stock PostgreSQL plus pg_partman, from docker/postgres-partman.Dockerfile — why that image
    # still carries two extensions nothing here uses: reference/compose.md#the-postgres-image.
    build:
      context: .
      dockerfile: docker/postgres-partman.Dockerfile
    image: ${POSTGRES_IMAGE:-openbot-postgres:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    # On `data`, off the Bots' default network — reference/compose.md#the-network-split has what that
    # keeps away from the one container that runs a Bot's shell.
    environment:
      POSTGRES_DB: openbot
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: openbot
    ports:
      # Loopback on both families; reference/compose.md#loopback-on-both-families says why one is not
      # enough, and #the-network-split why the interface is loopback at all.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
      - "[::1]:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Casdoor, Lago and OpenConnector: one role and one database each, read-only,
      # first-boot-of-a-fresh-volume only — reference/compose.md#the-databases-on-this-postgres.
      - ./casdoor/init-db.sql:/docker-entrypoint-initdb.d/10-casdoor.sql:ro
      - ./docker/lago/init-db.sql:/docker-entrypoint-initdb.d/20-lago.sql:ro
      - ./docker/openconnector/init-db.sql:/docker-entrypoint-initdb.d/30-openconnector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbot -d openbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    # Named and pullable like the other built images: reference/compose.md#image-names-and-pull-policy
    # is what `pull_policy` decides here (and what it does not guarantee).
    image: ${SERVER_IMAGE:-openbot-server:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    command: ["bun", "scripts/migrate.ts"]
    environment:
      DATABASE_URL: postgres://openbot:openbot@postgres:5432/openbot
      OPENBOT_BOOTSTRAP_ENTERPRISE_ROLES: "on"
    volumes:
      # #411: the TLS renewal-status record, read-only — the same ./tls directory the
      # certs sidecar owns (docker/compose/certs.yml mounts it writable there). Any
      # container running this server image can judge preview-origin admission from
      # the certificate's real health; the host-run API server reads the same file
      # through OPENBOT_TLS_STATUS_FILE (see docs/tls-certs.md).
      - ${OPENBOT_TLS_HOST_DIR:-./tls}:/etc/openbot/tls:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  # The Bot's computer is long-lived so browser sessions remain signed in across turns.
  agent-computer:
    build:
      context: .
      dockerfile: agent-computer/Dockerfile
    # Tagged explicitly: the supervisor starts one computer per Bot from this image by name.
    image: ${COMPUTER_IMAGE:-openbot-agent-computer:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    ports:
      # Loopback only. This process drives a browser holding real logins; COMPUTER_TOKEN is the
      # request control, and loopback keeps the surface off routed networks.
      - "127.0.0.1:${COMPUTER_PORT:-4100}:4100"
      - "[::1]:${COMPUTER_PORT:-4100}:4100"
    # Per-Bot egress: the names are not knowable here, and it is not `.env` because this container
    # must not receive the deployment's secrets — reference/compose.md#per-bot-egress.
    env_file:
      - path: ./egress.env
        required: false
    environment:
      # Traces flow to Tempo only when the observability stack is up and this points at it;
      # empty keeps the service recording locally without exporting (see shared/trace.ts).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${CONTAINER_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Request control for a loopback-bound port; a deployment sets a real one. The default
      # matches scripts/start.sh so `docker compose up -d` by hand configures the same stack.
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-openbot-dev-computer-token}
      # Headed by default: bot checks, Cloudflare's challenge among them, mind headless far more.
      COMPUTER_BROWSER_MODE: ${COMPUTER_BROWSER_MODE:-headed}
      # Browser budget and idle keepalive, defaults 8 and 30 minutes (a closed browser costs only
      # a relaunch, because the profile is on the volume below).
      COMPUTER_MAX_BROWSERS: ${COMPUTER_MAX_BROWSERS:-}
      COMPUTER_BROWSER_IDLE_MS: ${COMPUTER_BROWSER_IDLE_MS:-}
    volumes:
      - agent-workspace:/workspace
      # Chromium's user-data directory is volume-backed so logins survive container restarts.
      - agent-profiles:/profiles
    # Gives Chromium time to flush its profile after SIGTERM before Docker sends SIGKILL.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:4100/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-sandbox:
    build:
      context: .
      dockerfile: agent-sandbox/Dockerfile
      # Set NPM_REGISTRY in .env when the default registry is unreachable for the ~60MB opencode
      # binary packages (e.g. https://registry.npmmirror.com from a constrained network).
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: ${SANDBOX_IMAGE:-openbot-agent-sandbox:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    ports:
      # Loopback only: the sandbox runs arbitrary generated code; the token is the request
      # control and the published loopback keeps the surface off routed networks.
      - "127.0.0.1:${SANDBOX_PORT:-4300}:4300"
      - "[::1]:${SANDBOX_PORT:-4300}:4300"
      # Craft's per-session dev servers bind OPENBOT_CRAFT_SANDBOX_NEXTJS_PORT_[START|END]
      # inside; both sides of the publish read those same .env keys (defaults 3010/3100, the
      # craft config's own in server/src/craft/config.ts), so the published range and the
      # server's per-session allocation have one source — reference/compose.md#the-sandbox-port-range.
      - "127.0.0.1:${OPENBOT_CRAFT_SANDBOX_NEXTJS_PORT_START:-3010}-${OPENBOT_CRAFT_SANDBOX_NEXTJS_PORT_END:-3100}:${OPENBOT_CRAFT_SANDBOX_NEXTJS_PORT_START:-3010}-${OPENBOT_CRAFT_SANDBOX_NEXTJS_PORT_END:-3100}"
      - "[::1]:${OPENBOT_CRAFT_SANDBOX_NEXTJS_PORT_START:-3010}-${OPENBOT_CRAFT_SANDBOX_NEXTJS_PORT_END:-3100}:${OPENBOT_CRAFT_SANDBOX_NEXTJS_PORT_START:-3010}-${OPENBOT_CRAFT_SANDBOX_NEXTJS_PORT_END:-3100}"
    # Unprivileged, cap-less, no privilege escalation — the same posture Craft's Docker backend
    # provisions its per-user sandboxes with (docker_sandbox_manager.py).
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${SANDBOX_DOCKER_MEMORY_LIMIT:-2g}
    cpus: ${SANDBOX_DOCKER_CPU_LIMIT:-2}
    networks:
      - openbot_sandbox
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-openbot-dev-sandbox-token}
      # The model route, shared with the server's own GLM configuration in local development.
      SANDBOX_PROVIDER_BASE_URL: ${OPENAI_BASE_URL}
      SANDBOX_PROVIDER_API_KEY: ${OPENAI_API_KEY}
      SANDBOX_MODEL: ${BOT_MODEL:-GLM-5.3}
      # Per-bot lifecycle: each Bot gets its own opencode serve under /workspace/bots/<botId>.
      # Idle ones are reaped after SANDBOX_UPSTREAM_IDLE_MS (default 10 minutes) by a sweep that
      # runs every SANDBOX_SWEEP_INTERVAL_MS; SANDBOX_UPSTREAM_PORT_BASE is the first port a
      # per-bot serve may take. Workspace TTL sweeping is OFF by default (0): deleting a user's
      # files automatically must be an explicit opt-in.
      SANDBOX_UPSTREAM_IDLE_MS: ${SANDBOX_UPSTREAM_IDLE_MS:-600000}
      SANDBOX_SWEEP_INTERVAL_MS: ${SANDBOX_SWEEP_INTERVAL_MS:-60000}
      SANDBOX_UPSTREAM_PORT_BASE: ${SANDBOX_UPSTREAM_PORT_BASE:-4400}
      SANDBOX_WORKSPACE_TTL_MS: ${SANDBOX_WORKSPACE_TTL_MS:-0}
    volumes:
      - openbot-sandbox-workspace:/workspace
      - openbot-sandbox-config:/config
    restart: unless-stopped

  # OpenBot's own Redis: workshop turn locks and event fan-out, pure memory on purpose, on `data`
  # (never `openbot_sandbox`) so a sandbox cannot resolve it — reference/compose.md#the-redis-instances.
  openbot-redis:
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: --port 6379 --save '' --appendonly no
    restart: unless-stopped
    volumes:
      - openbot-redis-data:/data
    ports:
      - "127.0.0.1:${OPENBOT_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${OPENBOT_REDIS_MEM_LIMIT:-256m}
    networks:
      - data

  # Optional SPIRE workload identity for the computers: each gets an SVID from the labels the
  # supervisor sets, so one cannot claim another's identity. `spire-init` chowns the fresh volumes
  # (they arrive owned by root) so neither CA nor agent runs as root — reference/compose.md#spire.
  spire-init:
    image: busybox:1.37
    command: ["sh", "-c", "chown -R 1000:1000 /server /agent"]
    user: "0:0"
    volumes:
      - spire-server-data:/server
      - spire-agent-data:/agent

  spire-server:
    image: ghcr.io/spiffe/spire-server:1.15.1
    depends_on:
      spire-init:
        condition: service_completed_successfully
    command: ["-config", "/opt/spire/conf/server.conf"]
    # The CA state is the spire-server-data volume; a restart loses nothing.
    restart: unless-stopped
    volumes:
      - ./spire/server.conf:/opt/spire/conf/server.conf:ro
      # Mounted at the directory the image already owns so SPIRE can create its datastore as uid 1000.
      - spire-server-data:/opt/spire/data
      - spire-server-socket:/tmp/spire-server/private
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.15.1
    command: ["-config", "/opt/spire/conf/agent.conf", "-joinToken", "${SPIRE_JOIN_TOKEN:-openbot-dev-token}"]
    # The SVID persists in spire-agent-data, so a restart does not need the token again.
    restart: unless-stopped
    # pid: host — the attestor reads the peer cgroup from the host pid namespace.
    pid: host
    depends_on:
      spire-server:
        condition: service_healthy
      spire-init:
        condition: service_completed_successfully
    volumes:
      - ./spire/agent.conf:/opt/spire/conf/agent.conf:ro
      - spire-agent-socket:/tmp/spire-agent/public
      - spire-agent-data:/opt/spire/data
      # Read-only, and only so the docker workload attestor can see which container is asking.
      - ${ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro

  # One computer per Bot: its own container, files, browser session and processes. The Docker
  # socket is root-equivalent, so only the supervisor holds it —
  # reference/compose.md#the-supervisor-and-the-engine-socket.
  supervisor:
    build:
      context: .
      dockerfile: supervisor/Dockerfile
    # Published by a release; see migrate above for what pull_policy decides.
    image: ${SUPERVISOR_IMAGE:-openbot-supervisor:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    # Same file: this process does not read these; it forwards them into each computer it creates.
    env_file:
      - path: ./egress.env
        required: false
    environment:
      PORT: "4300"
      # Traces flow to Tempo only when the observability stack is up and this points at it;
      # empty keeps the service recording locally without exporting (see shared/trace.ts).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${CONTAINER_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Shared with the API server; the Bot-level verb set is the boundary. Defaulted so a plain
      # `docker compose up -d` configures the same stack scripts/start.sh does.
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:-openbot-dev-supervisor-token}
      # Handed to every computer this creates, so the server and the computers share one secret.
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-openbot-dev-computer-token}
      # Forwarded into every per-Bot computer the supervisor creates. Headed, as above.
      COMPUTER_BROWSER_MODE: ${COMPUTER_BROWSER_MODE:-headed}
      COMPUTER_IMAGE: ${COMPUTER_IMAGE:-openbot-agent-computer:latest}
      # Scopes the names the computers it creates derive; two stacks on one host stay apart.
      COMPUTER_NAMESPACE: ${COMPUTER_NAMESPACE:-openbot}
      # Empty keeps the host-port path (the API server runs on the host); set it for an in-Compose
      # server, so computers publish no host ports.
      COMPUTER_NETWORK: ${COMPUTER_NETWORK:-}
      # runsc runs every computer under gVisor where the host has it; unset shares the host kernel.
      COMPUTER_RUNTIME: ${COMPUTER_RUNTIME:-}
      # Identity, when SPIRE is part of this deployment. The supervisor registers an entry per Bot
      # and mounts the agent's socket into that Bot's computer so it can fetch its own SVID.
      SPIRE_SOCKET: /tmp/spire-server/private/api.sock
      SPIRE_TRUST_DOMAIN: openbot.local
      SPIRE_AGENT_ID: spiffe://openbot.local/spire/agent/join_token/${SPIRE_JOIN_TOKEN:-openbot-dev-token}
      SPIRE_AGENT_SOCKET_VOLUME: ${COMPOSE_PROJECT_NAME:-openbot}_spire-agent-socket
    ports:
      # For the server on the host. Loopback only — this process holds the Docker socket and the
      # token is a shared secret, not a network boundary. An in-Compose server sets COMPUTER_NETWORK
      # and reaches `supervisor:4300` instead.
      - "127.0.0.1:${SUPERVISOR_PORT:-4500}:4300"
      - "[::1]:${SUPERVISOR_PORT:-4500}:4300"
    volumes:
      # Read-only, still root-equivalent. ENGINE_SOCKET exists because the default path is wrong on
      # rootless Podman on Linux: point it at $XDG_RUNTIME_DIR/podman/podman.sock there
      # (reference/compose.md#the-supervisor-and-the-engine-socket).
      - ${ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      # To register an entry per Bot as each computer is created.
      - spire-server-socket:/tmp/spire-server/private
    security_opt:
      # The engine socket carries an SELinux label this container is not allowed to read.
      - label=disable
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:4300/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # The built-in Bot is an AG-UI endpoint registered the same way as a customer-provided Bot.
  agent-bot:
    build:
      context: .
      dockerfile: agent-bot/Dockerfile
    # Published by a release; see migrate above for what pull_policy decides.
    image: ${BOT_IMAGE:-openbot-agent-bot:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    ports:
      # Loopback: the token is the boundary, and nothing legitimate reaches a Bot off-machine.
      - "127.0.0.1:${BOT_PORT:-4200}:4200"
      - "[::1]:${BOT_PORT:-4200}:4200"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Traces flow to Tempo only when the observability stack is up and this points at it;
      # empty keeps the service recording locally without exporting (see shared/trace.ts).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${CONTAINER_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Server sends this on every call to the managed Bot. It refuses to start without it.
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      # Unset means OpenAI; set, any endpoint speaking the same API, with BOT_MODEL sent verbatim.
      OPENAI_BASE_URL: ${OPENAI_CONTAINER_BASE_URL:-${OPENAI_BASE_URL:-}}
      # gpt-5.5 on purpose: this Bot writes /v1/chat/completions by hand, where gpt-5.6-* rejects
      # function tools unless reasoning is off. Its own variable, separate from the framework Bot's.
      BOT_MODEL: ${AGENT_BOT_MODEL:-gpt-5.5}
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:4200/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # The harness somebody picked during setup. One service rather than twelve: the image and port
  # come from `.env`, written by the pick. Profile-gated so nothing picked means nothing starts —
  # and never built from this tree, so `pull_policy: missing` — reference/compose.md#the-picked-harness.
  agent-harness:
    profiles: ["harness"]
    image: ${PICKED_HARNESS_IMAGE:-}
    pull_policy: missing
    ports:
      # Loopback, image's own port on both sides; the server reaches it over the published port.
      - "127.0.0.1:${PICKED_HARNESS_PORT:-4202}:${PICKED_HARNESS_PORT:-4202}"
      - "[::1]:${PICKED_HARNESS_PORT:-4202}:${PICKED_HARNESS_PORT:-4202}"
    environment:
      # Every harness refuses without this; it is what makes the endpoint the server's alone.
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      # Deployment-owned tools use the same signed callback as agent-langgraph.
      OPENBOT_TOOL_URL: ${OPENBOT_TOOL_URL:-http://host.docker.internal:3001/api/agent-tools/call}
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:-}
      # Whichever the model screen chose; the ones it did not imply are written empty (see
      # `ModelCredential`).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_CONTAINER_BASE_URL:-${OPENAI_BASE_URL:-}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENERATIVE_AI_BASE_URL: ${GOOGLE_GENERATIVE_AI_BASE_URL:-}
      BOT_PROVIDER: ${BOT_PROVIDER:-openai}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Set only when a ChatGPT plan was signed in; the file is there either way.
      CHATGPT_AUTH_FILE: ${CHATGPT_AUTH_FILE:-}
      BOT_MODEL: ${BOT_MODEL:-gpt-5.5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # A bind mount on the containing directory, read-write: the hourly-renewed token must land
      # back here, and the provider replaces the file atomically (a file mount point would break).
      - ./.langchain:/root/.langchain

  # The same Bot behavior on a framework, exposed as another AG-UI endpoint and registry row.
  agent-langgraph:
    build:
      context: .
      dockerfile: agent-langgraph/Dockerfile
    # Published by a release; see migrate above for what pull_policy decides.
    image: ${LANGGRAPH_IMAGE:-openbot-agent-langgraph:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    ports:
      # Loopback, for the same reason as agent-bot above.
      - "127.0.0.1:${LANGGRAPH_PORT:-4201}:4201"
      - "[::1]:${LANGGRAPH_PORT:-4201}:4201"
    environment:
      # Traces flow to Tempo only when the observability stack is up and this points at it;
      # empty keeps the service recording locally without exporting (see shared/trace.ts). The
      # framework's callbacks ride this same path — never an Opik SDK auto-upload of their own.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${CONTAINER_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # The selected provider reads its own key. Models requiring the Responses API use
      # BOT_RESPONSES_API instead of changing the streaming loop here.
      BOT_PROVIDER: ${BOT_PROVIDER:-openai}
      # Same server-to-Bot request boundary as agent-bot above.
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_CONTAINER_BASE_URL:-${OPENAI_BASE_URL:-}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENERATIVE_AI_BASE_URL: ${GOOGLE_GENERATIVE_AI_BASE_URL:-}
      # Unset takes the spec file's row for the chosen provider instead of substituting gpt-5.5;
      # set wins, and a 5.6 tier named there switches the Responses API on by itself below.
      BOT_MODEL: ${BOT_MODEL:-}
      BOT_RESPONSES_API: ${BOT_RESPONSES_API:-false}
      # How hard it thinks, on a model that reasons. Empty leaves the provider's own default.
      BOT_REASONING_EFFORT: ${BOT_REASONING_EFFORT:-}
      # Tools run back through the deployment that granted them, never at the vendor.
      OPENBOT_TOOL_URL: ${OPENBOT_TOOL_URL:-http://host.docker.internal:3001/api/agent-tools/call}
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:4201/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # The trpc-agent-go Bot: the same Bot contract on a Go framework, registered from the workbench
  # like any bring-your-own agent. Not the enterprise go-runtime candidate, which is separate.
  agent-trpc:
    build:
      # Repository root: the default model lives in shared/model-providers.json, copied into the image.
      context: .
      dockerfile: agent-trpc/Dockerfile.bot
    image: ${AGENT_TRPC_IMAGE:-openbot-agent-trpc:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    ports:
      # Loopback, for the same reason as agent-bot above.
      - "127.0.0.1:${AGENT_TRPC_PORT:-4204}:4204"
      - "[::1]:${AGENT_TRPC_PORT:-4204}:4204"
    environment:
      # Same server-to-Bot request boundary as agent-bot above.
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # AGENT_TRPC_BASE_URL is this Bot's own override: point it at GLM (or any OpenAI-compatible
      # endpoint) without moving every other Bot off the shared chain.
      OPENAI_BASE_URL: ${AGENT_TRPC_BASE_URL:-${OPENAI_CONTAINER_BASE_URL:-${OPENAI_BASE_URL:-}}}
      # The bots.agent-trpc row's gpt-5.5 unless a deployment names its own.
      BOT_MODEL: ${AGENT_TRPC_MODEL:-}
    healthcheck:
      # Exec-form: the image is distroless, so the binary probes itself.
      test: ["CMD", "/agent-trpc-bot", "-healthcheck", "http://localhost:4204/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The Go runtime candidate: a verification-candidate execution runtime the ENTERPRISE entry's
  # run gateway dials. Off by default; starts with `docker compose --profile go-runtime up
  # go-runtime`. Loopback only — the host-run enterprise entry is the sole caller
  # (reference/compose.md#the-go-runtime).
  go-runtime:
    profiles: ["go-runtime"]
    build:
      context: ./runtime-go
      dockerfile: Dockerfile
    image: ${GO_RUNTIME_IMAGE:-openbot-go-runtime:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    ports:
      # Loopback only: the enterprise entry (a host process) is the sole caller.
      - "127.0.0.1:${GO_RUNTIME_PORT:-4203}:4203"
      - "[::1]:${GO_RUNTIME_PORT:-4203}:4203"
    environment:
      # The shared service credential; the enterprise entry must carry the same value.
      OPENBOT_RUNTIME_SERVICE_CREDENTIAL: ${ENTERPRISE_RUNTIME_SERVICE_CREDENTIAL:-}
      # The model credential is optional only for the isolated fake provider.
      OPENBOT_RUNTIME_MODEL_CREDENTIAL: ${ENTERPRISE_RUNTIME_MODEL_CREDENTIAL:-${OPENAI_API_KEY:-}}
    # Every required flag (runtimeconfig refuses to boot with any missing).
    command:
      - "-addr=0.0.0.0:4203"
      - "-validation-endpoint=${ENTERPRISE_RUNTIME_VALIDATE_URL:-http://host.docker.internal:3101/internal/enterprise/v1/runtime/validate}"
      - "-model-base-url=${ENTERPRISE_RUNTIME_MODEL_BASE_URL:-https://open.bigmodel.cn/api/coding/paas/v4}"
      - "-model-alias=${ENTERPRISE_RUNTIME_MODEL_ALIAS:-GLM-5.3}"
      - "-model-route-ref=${ENTERPRISE_RUNTIME_MODEL_ROUTE_REF:-glm-53-default}"
      - "-expert=assistant-v1=/experts/assistant-v1.txt"
      - "-governed-tools=${ENTERPRISE_RUNTIME_GOVERNED_TOOLS:-}"
      - "-callback-endpoint=${ENTERPRISE_RUNTIME_CALLBACK_URL:-http://host.docker.internal:3101/internal/enterprise/v1/tool-invocations}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  # Database and the services that reach it by name; nothing a Bot can reach is on it. An
  # in-Compose API server joins this and `default` — reference/compose.md#the-network-split.
  data:
  # Everything else — where Compose's default already put it; named so a service added without a
  # `networks:` key keeps landing beside the Bots rather than beside the database.
  default:
  # The sandbox's own bridge: nothing of the stack resolves by name here, the internet still does.
  openbot_sandbox:

volumes:
  postgres-data:
  agent-workspace:
  spire-server-data:
  spire-server-socket:
  spire-agent-socket:
  spire-agent-data:
  agent-profiles:
  openbot-redis-data:
  openbot-sandbox-workspace:
  openbot-sandbox-config:
