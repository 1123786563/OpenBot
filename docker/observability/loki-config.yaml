auth_enabled: false
server:
  # 3102, not the upstream default 3100: 3100 is open-connector's on the host, and keeping the
  # in-container port equal to the published one lets every consumer — the published loopback
  # port, Alloy's push URL, Grafana's datasource — say the same number.
  http_listen_port: 3102
  grpc_listen_port: 9096
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 168h
  reject_old_samples: false
ruler:
  storage:
    # `filesystem:` under ruler.storage was removed in Loki 3.x; the local backend is the
    # single-binary form 3.5 accepts.
    type: local
    local:
      directory: /loki/rules
